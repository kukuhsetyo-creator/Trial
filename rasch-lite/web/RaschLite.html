<script>/* RaschLite: mesin interpretasi (padanan interpret/narrative.py).
 *
 * Kalimat disusun persis seperti versi Python sehingga narasi kedua versi identik
 * (diuji terhadap Markdown dari engine Python). Ambang dibaca dari TEXT.rules yang
 * diekspor dari interpret/rules.py.
 */
(function (root) {
  "use strict";

  let TEXT = root.RASCH_TEXT || null;
  function setText(t) { TEXT = t; }
  const R = () => TEXT.rules;

  function num(x, d = 2) {
    if (x === null || x === undefined || typeof x !== "number" || !isFinite(x)) return "-";
    let text = fixedHalfEven(x, d);
    if (text.startsWith("-") && Number(text) === 0) text = text.slice(1); // tanpa "-0,00"
    return text.replace(".", ",");
  }
  /** Seperti Python f"{x:.{d}f}": pembulatan setengah-ke-genap atas nilai biner eksak. */
  function fixedHalfEven(x, d) {
    const text = x.toFixed(d);
    const exact = Math.abs(x).toFixed(Math.min(d + 30, 100));
    const tail = exact.slice(exact.indexOf(".") + 1 + d);
    if (!/^50*$/.test(tail)) return text;
    const kept = Math.abs(x).toFixed(Math.min(d + 30, 100)).slice(0, exact.indexOf(".") + 1 + d).replace(/\.$/, "");
    const lastDigit = Number(kept.replace(".", "").slice(-1));
    if (lastDigit % 2 === 0) return (x < 0 ? "-" : "") + kept; // genap: dibulatkan ke bawah
    return text;
  }
  function pct(x, d = 0) { return num(x, d) + "%"; }
  function pval(p) {
    if (p === null || p === undefined || !isFinite(p)) return "-";
    return p < 0.001 ? "< 0,001" : num(p, 3);
  }
  function names(values, k, unit = "item") {
    if (k === undefined || k === null) k = TEXT.maxListed;
    values = values.map(String);
    if (!values.length) return "";
    if (values.length > k) return values.slice(0, k).join(", ") + `, dan ${values.length - k} ${unit} lainnya`;
    if (values.length === 1) return values[0];
    return values.slice(0, -1).join(", ") + " dan " + values[values.length - 1];
  }
  const refs = (...keys) => keys.map((k) => R().REFERENCES[k]);
  const T = (label, value, criterion = "") => ({ label, value, criterion });
  const isF = (v) => typeof v === "number" && isFinite(v);
  const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
  const unique = (arr) => Array.from(new Set(arr));
  const MAX = () => TEXT.maxListed;

  function intro(model) {
    const second = model === "dichotomous"
      ? "Ketika kemampuan seorang person sama dengan kesulitan sebuah item, peluangnya menjawab " +
        "benar adalah 50%. Bila kemampuannya satu logit di atas kesulitan item, peluang itu naik " +
        "menjadi sekitar 73%; dua logit di atas, sekitar 88%. Selisih yang sama selalu bermakna " +
        "sama di bagian mana pun penggaris, dan inilah yang membuat measure Rasch berbeda dari " +
        "sekadar menjumlah jawaban benar (raw score)."
      : "Pada skala bertingkat, person measure yang lebih tinggi daripada item measure berarti " +
        "person itu lebih mungkin memilih kategori jawaban yang lebih tinggi (misalnya 'setuju' " +
        "daripada 'netral'). Selisih yang sama selalu bermakna sama di bagian mana pun penggaris, " +
        "sehingga measure dapat dibandingkan secara adil antar-person.";
    return [
      "Analisis Rasch menempatkan kemampuan person (responden) dan kesulitan item (butir) pada satu " +
      "'penggaris bersama' yang satuannya disebut logit; posisi pada penggaris itu disebut measure. " +
      "Titik nol penggaris ditetapkan pada rata-rata item measure; angka positif berarti di atas " +
      "rata-rata itu, angka negatif di bawahnya.",
      second,
    ];
  }

  function reliability(res) {
    const s = res.summary, r = R();
    const pr = s.person_reliability, ps = s.person_separation, pstr = s.person_strata;
    const ir = s.item_reliability, isep = s.item_separation;
    const personOk = pr >= r.PERSON_RELIABILITY_GOOD && ps >= r.PERSON_SEPARATION_GOOD;
    const itemOk = ir >= r.ITEM_RELIABILITY_GOOD && isep >= r.ITEM_SEPARATION_GOOD;
    let status, sentence;
    if (!isF(pr) || pr < r.PERSON_RELIABILITY_POOR) {
      status = r.RED;
      sentence = `Konsistensi pengukuran person rendah (person reliability ${num(pr)}); measure ` +
        "individual perlu ditafsirkan dengan sangat hati-hati.";
    } else if (personOk && itemOk) {
      status = r.GREEN;
      sentence = `Tes cukup konsisten membedakan person (person reliability ${num(pr)}, person ` +
        `separation ${num(ps)}) dan hierarki kesulitan item-nya stabil (item reliability ${num(ir)}).`;
    } else {
      status = r.YELLOW;
      const weak = [];
      if (!personOk) weak.push(`person reliability ${num(pr)}, person separation ${num(ps)}`);
      if (!itemOk) weak.push(`item reliability ${num(ir)}, item separation ${num(isep)}`);
      sentence = `Konsistensi pengukuran memadai tetapi belum ideal (${weak.join("; ")}).`;
    }
    const strataN = isF(pstr) ? Math.floor(pstr) : 0;
    const paras = [
      "Reliability dapat dibayangkan seperti timbangan badan: timbangan yang baik memberi angka yang " +
      "hampir sama bila Anda menimbang dua kali. Dalam analisis Rasch, person reliability sebesar " +
      `${num(pr)} mengindikasikan bahwa sekitar ${pct(100 * pr)} perbedaan measure antar-person ` +
      "mencerminkan perbedaan yang sebenarnya, sedangkan sisanya adalah galat ukur. Person separation " +
      `${num(ps)} berarti tes ini kira-kira mampu memisahkan person ke dalam ${Math.max(strataN, 1)} kelompok ` +
      `kemampuan yang berbeda secara statistik (person strata ${num(pstr)}).`,
      `Untuk item, item reliability ${num(ir)} dan item separation ${num(isep)} menunjukkan seberapa ` +
      "stabil hierarki kesulitan item bila tes diberikan pada sampel lain yang serupa. Nilai ini " +
      "terutama dipengaruhi jumlah person: makin banyak person, makin presisi posisi setiap item.",
    ];
    if (isF(s.alpha)) {
      paras.push(`Sebagai pembanding klasik, ${s.alpha_label} sebesar ${num(s.alpha)} dihitung dari ` +
        `${s.alpha_n} person dengan jawaban lengkap. Angka ini sering sedikit berbeda dari person ` +
        "reliability Rasch karena memakai raw score dan menyertakan extreme score.");
    }
    const actions = [];
    if (!personOk) {
      actions.push("Pertimbangkan menambah item yang tingkat kesulitannya sesuai dengan kemampuan sebagian " +
        "besar person, karena item yang well-targeted paling banyak menambah presisi.");
      actions.push("Telaah item yang misfit (lihat bagian Item and Person Fit); item yang 'berisik' " +
        "menurunkan reliability.");
    }
    if (!itemOk) {
      actions.push("Bila tujuan Anda memastikan hierarki kesulitan item, perbanyak person atau libatkan " +
        "person dengan kemampuan yang lebih beragam.");
    }
    const p = s.person, i = s.item;
    const tech = [
      T("Person reliability (REAL / MODEL)", `${num(pr)} / ${num(p.model_reliability)}`,
        `baik >= ${num(r.PERSON_RELIABILITY_GOOD)}; rendah < ${num(r.PERSON_RELIABILITY_POOR)}`),
      T("Person separation (REAL / MODEL)", `${num(ps)} / ${num(p.model_separation)}`, `>= ${num(r.PERSON_SEPARATION_GOOD, 1)}`),
      T("Person strata", num(pstr), "(4G + 1) / 3"),
      T("Item reliability (REAL / MODEL)", `${num(ir)} / ${num(i.model_reliability)}`, `>= ${num(r.ITEM_RELIABILITY_GOOD)}`),
      T("Item separation (REAL / MODEL)", `${num(isep)} / ${num(i.model_separation)}`, `>= ${num(r.ITEM_SEPARATION_GOOD, 1)}`),
      T("Person RMSE (REAL)", num(p.real_rmse, 3), ""),
      T("Person measure SD (population)", num(p.sd, 3), ""),
      T(s.alpha_label, num(s.alpha), `n lengkap = ${s.alpha_n}`),
    ];
    const section = { key: "reliability", title: "Reliability and Separation", status, paragraphs: paras, actions,
      technical: tech, references: refs("fisher_2007", "linacre_winsteps_manual", "wright_masters_2002_strata", "cronbach_1951") };
    return [{ key: "reliability", title: "Reliability", status, sentence }, section];
  }

  function itemFit(res) {
    const r = R();
    const est = res.items.filter((x) => !x.extreme);
    const [lo, hi] = res.settings.mnsq_range;
    const isUnder = (x) => x.infit_mnsq > hi || x.outfit_mnsq > hi;
    const under = est.filter(isUnder);
    const over = est.filter((x) => (x.infit_mnsq < lo || x.outfit_mnsq < lo) && !isUnder(x));
    const degrading = est.filter((x) => x.infit_mnsq > r.MNSQ_DEGRADING || x.outfit_mnsq > r.MNSQ_DEGRADING);
    const negpt = est.filter((x) => x.ptmea_obs < r.PTMEASURE_MIN);
    const order = est.map((x) => x.item);
    const byOrder = (set) => order.filter((n) => set.has(n));
    const serious = byOrder(new Set([...degrading.map((x) => x.item), ...negpt.map((x) => x.item)]));
    const flagged = byOrder(new Set([...under.map((x) => x.item), ...over.map((x) => x.item), ...serious]));
    const rng = `${num(lo, 1)}-${num(hi, 1)}`;
    let status, sentence;
    if (serious.length) {
      status = r.RED;
      sentence = `${serious.length} item menunjukkan misfit serius dan perlu ditelaah lebih dulu: ${names(serious)}.`;
    } else if (flagged.length) {
      status = r.YELLOW;
      sentence = `${flagged.length} item berada di luar rentang MNSQ ${rng} dan perlu diperiksa: ${names(flagged)}.`;
    } else {
      status = r.GREEN;
      sentence = `Semua ${est.length} item berperilaku sesuai harapan model (Infit dan Outfit MNSQ dalam ` +
        `rentang ${rng}).`;
    }
    const paras = [
      "Statistik fit bekerja seperti alarm kejutan. MNSQ bernilai 1 berarti jawaban menyimpang dari " +
      `harapan model sebesar yang wajar terjadi secara acak. Nilai di atas ${num(hi, 1)} (underfit) berarti ` +
      "terlalu banyak kejutan, misalnya person pandai yang salah pada soal mudah; nilai di bawah " +
      `${num(lo, 1)} (overfit) berarti pola jawaban terlalu mudah ditebak. Infit lebih peka terhadap ` +
      "kejutan dari person yang kemampuannya setara dengan kesulitan item, sedangkan outfit lebih peka " +
      "terhadap beberapa jawaban yang sangat mengejutkan.",
    ];
    if (under.length) {
      const detail = under.slice(0, MAX()).map((x) => `${x.item} (infit ${num(x.infit_mnsq)}, outfit ${num(x.outfit_mnsq)})`).join("; ");
      const more = under.length > MAX() ? `, serta ${under.length - MAX()} item lain` : "";
      paras.push(`Item yang underfit (kejutan berlebih): ${detail}${more}. Pola ini mengindikasikan jawaban yang ` +
        "lebih acak daripada harapan. Kemungkinan penyebabnya antara lain redaksi yang ambigu, kunci " +
        "jawaban yang keliru, banyak tebakan, atau item yang mengukur hal lain. Bila hanya outfit yang " +
        "tinggi, sumbernya kemungkinan sedikit jawaban yang sangat mengejutkan (salah ceroboh atau " +
        "tebakan beruntung), bukan item-nya secara keseluruhan.");
    }
    if (over.length) {
      paras.push(`Item yang overfit (pola terlalu mudah ditebak): ${names(over.map((x) => x.item))}. Kondisi ini umumnya tidak ` +
        "merusak pengukuran, tetapi dapat menandakan item yang menanyakan hal hampir sama dengan item " +
        "lain atau item yang sangat membedakan kelompok atas dan bawah.");
    }
    if (negpt.length) {
      paras.push(`Point-measure correlation negatif ditemukan pada ${names(negpt.map((x) => x.item))}: person yang lebih mampu ` +
        "justru cenderung mendapat skor lebih rendah pada item tersebut. Hal ini mengindikasikan " +
        "kemungkinan kunci jawaban yang salah, atau pada angket, item berkalimat negatif (reverse-coded) " +
        "yang skornya belum dibalik.");
    } else if (est.length <= 10) {
      paras.push(`Karena skala ini pendek (${est.length} item), periksa juga item yang point-measure correlation ` +
        "teramatinya jauh di bawah nilai harapannya. Pada skala pendek, item reverse-coded yang belum " +
        "dibalik tidak selalu menghasilkan korelasi negatif karena skor item itu sendiri ikut menyusun " +
        "measure.");
    }
    const pe = res.persons.filter((x) => !x.extreme && isF(x.measure));
    const pm = pe.filter((x) => x.flag_misfit);
    const share = 100 * pm.length / Math.max(pe.length, 1);
    const worst = pm.map((x, k) => [x, k]).sort((a, b) => {
      const va = a[0].outfit_mnsq, vb = b[0].outfit_mnsq;
      if (Number.isNaN(va) !== Number.isNaN(vb)) return Number.isNaN(va) ? 1 : -1;
      return vb - va || a[1] - b[1];
    }).slice(0, 5).map((p) => p[0]);
    paras.push(`Pada sisi person fit, ${pm.length} dari ${pe.length} person non-extreme (${pct(share)}) memiliki MNSQ di ` +
      `luar rentang ${rng}` +
      (pm.length ? `; yang paling menyimpang antara lain ${names(worst.map((x) => x.person), 5, "person")}` : "") +
      `. Karena setiap person hanya menjawab ${est.length} item, person MNSQ berfluktuasi cukup besar secara ` +
      "kebetulan, sehingga sebagian person dapat tampak misfit walaupun menjawab dengan wajar. Pola yang " +
      "benar-benar menyimpang dapat berasal dari menjawab asal, menebak, kelelahan, atau kesalahan entri " +
      "data; karena itu person tersebut perlu diperiksa, bukan otomatis dihapus.");
    const actions = [];
    if (degrading.length) actions.push(`Pertimbangkan mengeluarkan ${names(degrading.map((x) => x.item))} (MNSQ > ${num(r.MNSQ_DEGRADING, 1)}) ` +
      "lalu jalankan ulang analisis untuk melihat dampaknya.");
    if (negpt.length) actions.push(`Periksa kunci jawaban atau arah skor ${names(negpt.map((x) => x.item))}; balik skornya bila item ` +
      "tersebut berkalimat negatif (reverse-coded).");
    if (under.length) actions.push(`Telaah redaksi, pilihan jawaban, dan kunci ${names(under.map((x) => x.item))}; revisi bagian yang ` +
      "ambigu.");
    if (over.length) actions.push(`Periksa apakah ${names(over.map((x) => x.item))} tumpang tindih isinya dengan item lain.`);
    if (pm.length) actions.push("Periksa lembar jawaban person yang misfit; sebagai analisis sensitivitas, jalankan ulang " +
      "tanpa mereka dan bandingkan hasilnya.");
    const s = res.summary;
    const tech = [
      T("MNSQ fit range", rng, res.settings.strict_fit ? "strict (high-stakes)" : "productive for measurement"),
      T("Degrading MNSQ limit", num(r.MNSQ_DEGRADING, 1), "> nilai ini: merah"),
      T("Mean item Infit / Outfit MNSQ", `${num(s.item_mean_infit)} / ${num(s.item_mean_outfit)}`, "~1,00"),
      T("Mean person Infit / Outfit MNSQ", `${num(s.person_mean_infit)} / ${num(s.person_mean_outfit)}`, "~1,00"),
      T("Misfitting items", String(flagged.length), "0"),
      T("Items with negative PTMEA", String(negpt.length), "0"),
      T("Misfitting persons", `${pm.length} (${pct(share, 1)})`, ""),
    ];
    for (const x of est.filter((x) => flagged.includes(x.item))) {
      tech.push(T(`  ${x.item}`, `Infit ${num(x.infit_mnsq)} (ZSTD ${num(x.infit_zstd, 1)}), ` +
        `Outfit ${num(x.outfit_mnsq)} (ZSTD ${num(x.outfit_zstd, 1)}), ` +
        `PTMEA ${num(x.ptmea_obs)} / exp. ${num(x.ptmea_exp)}`, ""));
    }
    const rk = ["linacre_2002_mnsq", "wright_masters_1982", "wilson_hilferty_1931"];
    if (res.settings.strict_fit) rk.splice(1, 0, "wright_linacre_1994");
    const section = { key: "item_fit", title: "Item and Person Fit", status, paragraphs: paras, actions, technical: tech, references: refs(...rk) };
    return [{ key: "item_fit", title: "Item Fit", status, sentence }, section];
  }

  function dimensionality(res) {
    const r = R(), d = res.dimensionality, q3 = res.q3;
    const eig = d.first_contrast_eigenvalue;
    const load = d.loadings.map((x, k) => [x[0], x[1], k]).sort((a, b) => a[1] - b[1] || a[2] - b[2]);
    const pos = load.slice().reverse().filter((x) => x[1] > 0).map((x) => x[0]).slice(0, 3);
    const neg = load.filter((x) => x[1] < 0).map((x) => x[0]).slice(0, 3);
    const pairs = q3.flagged_pairs;
    const pairText = names(pairs.map((p) => `${p.item_a}-${p.item_b} (Q3 ${num(p.q3)})`), undefined, "pasangan");
    let status, sentence;
    if (eig >= r.CONTRAST_EIGENVALUE_RED) {
      status = r.RED;
      sentence = `Terdapat indikasi dimensi kedua yang cukup kuat (first contrast eigenvalue ${num(eig)}); ` +
        "skor total mungkin mencampur dua hal berbeda.";
    } else if (eig >= r.CONTRAST_EIGENVALUE_MAX || pairs.length) {
      status = r.YELLOW;
      const parts = [];
      if (eig >= r.CONTRAST_EIGENVALUE_MAX) parts.push(`first contrast eigenvalue ${num(eig)}`);
      if (pairs.length) parts.push(`${pairs.length} pasangan item dengan local dependence`);
      sentence = `Asumsi unidimensionality perlu diperiksa (${parts.join(" dan ")}).`;
    } else {
      status = r.GREEN;
      sentence = `Data mendukung unidimensionality: tes mengukur satu hal utama (first contrast eigenvalue ` +
        `${num(eig)} < ${num(r.CONTRAST_EIGENVALUE_MAX, 1)}) tanpa pasangan item yang saling ` +
        "bergantung.";
    }
    const paras = [
      "Unidimensionality berarti semua item mengukur satu hal yang sama, seperti semua soal ujian " +
      "matematika memang mengukur kemampuan matematika dan bukan kemampuan membaca. Setelah pengaruh " +
      "measure dikeluarkan, sisa jawaban (residual) seharusnya acak. PCA of residuals (analisis komponen " +
      "utama atas residual) mencari pola yang tersisa; first contrast eigenvalue menyatakan kekuatan pola " +
      "itu dalam satuan 'setara sekian item'.",
      `Raw variance explained by measures sebesar ${pct(d.variance_explained_pct, 1)}. Angka ini sangat ` +
      "bergantung pada sebaran kemampuan person dan kesulitan item, sehingga tidak dipakai sebagai kriteria " +
      "tunggal.",
    ];
    if (eig >= r.CONTRAST_EIGENVALUE_MAX) {
      paras.push(`First contrast memiliki kekuatan setara sekitar ${num(eig, 1)} item. Item dengan loading positif ` +
        `terbesar (${names(pos)}) dan negatif terbesar (${names(neg)}) membentuk dua kutub. Telaah isi kedua ` +
        "kelompok ini: bila keduanya mengukur aspek yang berbeda secara bermakna (misalnya soal hitungan " +
        "dan soal cerita), dimensi kedua tersebut kemungkinan nyata.");
    } else {
      paras.push(`Pola yang tersisa (eigenvalue ${num(eig)}) masih dalam batas yang wajar terjadi secara ` +
        "kebetulan.");
    }
    if (pairs.length) {
      paras.push(`Local dependence terdeteksi pada ${pairText}. Dua item seperti ini seolah 'saling menyontek': ` +
        "jawaban satu item ikut menentukan jawaban item lain di luar kemampuan yang diukur, misalnya soal " +
        "bertingkat dari satu wacana atau dua item dengan redaksi hampir sama. Akibatnya reliability dapat " +
        "tampak lebih tinggi daripada yang sebenarnya.");
    }
    const actions = [];
    if (eig >= r.CONTRAST_EIGENVALUE_MAX) actions.push(`Bandingkan isi ${names(pos)} dengan ${names(neg)}; bila memang berbeda konstruk, ` +
      "pertimbangkan melaporkan skor terpisah atau menganalisis kedua kelompok secara terpisah.");
    if (pairs.length) actions.push("Untuk pasangan yang saling bergantung, pertimbangkan menggabungkannya menjadi satu item " +
      "bertingkat (testlet), merevisi redaksinya, atau mempertahankan salah satunya.");
    const tech = [
      T("First contrast eigenvalue", num(eig),
        `< ${num(r.CONTRAST_EIGENVALUE_MAX, 1)} hijau; >= ${num(r.CONTRAST_EIGENVALUE_RED, 1)} merah`),
      T("Raw variance explained by measures", pct(d.variance_explained_pct, 1), "tidak dipakai sebagai kriteria"),
      T("First contrast (% of total variance)", pct(d.first_contrast_pct_total, 1), ""),
      T("Mean Q3", num(q3.mean, 3), ""),
      T(`Q3 cutoff (mean Q3 + ${num(r.Q3_RELATIVE_CUTOFF, 1)})`, num(q3.cutoff, 3), `+${num(r.Q3_RELATIVE_CUTOFF, 1)}`),
      T("Max Q3", num(q3.max, 3), ""),
      T("Flagged Q3 pairs", String(pairs.length), "0"),
    ];
    const section = { key: "dimensionality", title: "Dimensionality and Local Dependence", status, paragraphs: paras, actions,
      technical: tech, references: refs("linacre_winsteps_manual", "raiche_2005", "linacre_2006_variance", "christensen_2017", "yen_1984") };
    return [{ key: "dimensionality", title: "Dimensionality", status, sentence }, section];
  }

  function targetingUnit(rmse) {
    return isF(rmse) && rmse > 0 ? Math.min(1, rmse) : 1;
  }

  function targeting(res) {
    const r = R(), s = res.summary;
    const diff = s.targeting;
    const poly = res.model !== "dichotomous";
    const ad = Math.abs(diff);
    const unit = targetingUnit(s.person.model_rmse);
    const ratio = ad / unit;
    const status = ratio < r.TARGETING_GOOD ? r.GREEN : ratio < r.TARGETING_POOR ? r.YELLOW : r.RED;
    const direction = diff > 0
      ? (poly ? "person cenderung mudah memberi skor tinggi pada item-item ini" : "tes relatif mudah bagi kelompok ini")
      : (poly ? "person cenderung jarang memberi skor tinggi pada item-item ini" : "tes relatif sulit bagi kelompok ini");
    const sentence = status === r.GREEN
      ? `Tingkat kesulitan item sesuai dengan kemampuan person (selisih rata-rata measure ${num(diff)} logit).`
      : `Rata-rata person measure berada ${num(ad)} logit ${diff > 0 ? "di atas" : "di bawah"} ` +
        `rata-rata item measure; ${direction}.`;
    const valid = res.persons.filter((x) => isF(x.measure));
    const nMax = res.coded.personExtreme.filter((v) => v === 1).length;
    const nMin = res.coded.personExtreme.filter((v) => v === -1).length;
    let loc;
    if (poly) loc = res.jmle.thresholdLocation.flatMap((row) => Array.from(row).filter(isF));
    else loc = res.items.filter((x) => !x.extreme).map((x) => x.measure);
    const pm = valid.map((x) => x.measure);
    const above = loc.length ? 100 * mean(pm.map((v) => (v > Math.max(...loc) ? 1 : 0))) : NaN;
    const below = loc.length ? 100 * mean(pm.map((v) => (v < Math.min(...loc) ? 1 : 0))) : NaN;
    const tw = poly ? "threshold" : "item";
    const paras = [
      "Targeting ibarat memasang mistar lompat tinggi. Bila mistar dipasang jauh di bawah kemampuan semua " +
      "peserta, semuanya lolos dan kita tidak tahu siapa yang paling hebat; bila terlalu tinggi, semuanya " +
      "gagal. Tes yang well-targeted berisi item dengan kesulitan yang menyebar di sekitar kemampuan person, " +
      "sehingga setiap item memberi informasi.",
      `Rata-rata person measure adalah ${num(s.person_mean)} logit, sedangkan rata-rata item measure ` +
      `ditetapkan 0 logit; selisihnya ${num(diff)} logit` +
      (status === r.GREEN ? ", relatif kecil sehingga item umumnya berada di sekitar kemampuan person. "
        : `, yang mengindikasikan ${direction}. `) +
      `Sekitar ${pct(above)} person berada di atas ${tw} tersulit dan ${pct(below)} di bawah ` +
      `${tw} termudah, wilayah tempat tes memberi sedikit informasi.`,
    ];
    if (nMax || nMin) {
      paras.push(`Sebanyak ${nMax} person mendapat skor maksimum dan ${nMin} skor minimum (extreme score). Batas ` +
        "kemampuan mereka tidak terukur oleh tes ini, sehingga measure mereka hanya perkiraan dengan " +
        "penyesuaian 0,3 poin.");
    }
    const actions = [];
    if (status !== r.GREEN) {
      if (diff > 0) actions.push("Tambahkan item yang lebih sulit" + (poly ? " (pernyataan yang lebih 'berat' untuk disetujui)" : "") +
        " agar person berkemampuan tinggi juga terukur presisi.");
      else actions.push("Tambahkan item yang lebih mudah" + (poly ? " (pernyataan yang lebih mudah disetujui)" : "") +
        " agar person berkemampuan rendah juga terukur presisi.");
    }
    if (nMax + nMin > 0.05 * Math.max(valid.length, 1)) {
      actions.push("Proporsi extreme score cukup besar; pertimbangkan memperluas rentang kesulitan item.");
    }
    const tech = [
      T("Mean person measure (non-extreme)", num(s.person_mean), ""),
      T("Person measure SD", num(s.person.sd), ""),
      T("Mean item measure", num(s.item_mean), "0 (identifikasi skala)"),
      T("Targeting (mean difference)", `${num(diff)} logit = ${num(ratio)} satuan`,
        `< ${num(r.TARGETING_GOOD, 1)} satuan hijau; >= ${num(r.TARGETING_POOR, 1)} satuan merah`),
      T("Targeting unit", `${num(unit, 3)} logit`,
        "yang lebih kecil antara 1 logit dan person RMSE (MODEL); tafsiran teraman tabel Fisher (2007)"),
      T(`Persons above the hardest ${tw}`, pct(above, 1), ""),
      T(`Persons below the easiest ${tw}`, pct(below, 1), ""),
      T("Extreme scores (maximum / minimum)", `${nMax} / ${nMin}`, ""),
    ];
    const section = { key: "targeting", title: "Targeting", status, paragraphs: paras, actions, technical: tech,
      references: refs("fisher_2007", "wright_stone_1979") };
    return [{ key: "targeting", title: "Targeting", status, sentence }, section];
  }

  function categories(res) {
    const r = R();
    if (res.model === "dichotomous" || !res.categories) {
      const section = { key: "categories", title: "Category Functioning", status: r.GRAY,
        paragraphs: ["Analisis category functioning hanya relevan untuk skala bertingkat (polytomous)."],
        actions: [], technical: [], references: [] };
      return [{ key: "categories", title: "Category Functioning", status: r.GRAY,
        sentence: "Tidak berlaku: data dichotomous hanya memiliki dua kategori." }, section];
    }
    const cat = res.categories, rsm = res.model === "rsm";
    const disT = cat.filter((x) => x.flag_disordered_threshold);
    const disA = cat.filter((x) => x.flag_disordered_avg);
    const low = cat.filter((x) => x.flag_low_count);
    const hiOut = cat.filter((x) => x.flag_outfit_high);
    const order = unique(cat.map((x) => x.item));
    const where = (df) => (rsm ? "skala bersama" : names(order.filter((n) => df.some((x) => x.item === n))));
    let status, sentence;
    if (disT.length || disA.length) {
      status = r.RED;
      const bits = [];
      if (disT.length) bits.push(`disordered threshold (${where(disT)})`);
      if (disA.length) bits.push(`observed average tidak naik (${where(disA)})`);
      sentence = `Sebagian kategori jawaban tidak berfungsi berurutan: ${bits.join("; ")}.`;
    } else if (low.length || hiOut.length) {
      status = r.YELLOW;
      const bits = [];
      if (low.length) bits.push(`${low.length} kategori dengan kurang dari ${r.CATEGORY_MIN_COUNT} observasi`);
      if (hiOut.length) bits.push(`${hiOut.length} kategori dengan category outfit tinggi`);
      sentence = `Kategori jawaban berurutan, tetapi ada ${bits.join(" dan ")}.`;
    } else {
      status = r.GREEN;
      sentence = "Kategori jawaban berfungsi berurutan dan cukup sering dipakai.";
    }
    const paras = [
      "Kategori jawaban dapat dibayangkan sebagai anak tangga. Setiap Andrich threshold adalah titik tempat " +
      "person beralih dari satu kategori ke kategori berikutnya, dan seharusnya lebih tinggi daripada " +
      "threshold sebelumnya. Bila sebuah threshold lebih rendah dari sebelumnya (disordered threshold), ada " +
      "kategori yang jarang menjadi pilihan paling mungkin bagi siapa pun, sehingga person kemungkinan sulit " +
      "membedakannya dari kategori di sebelahnya.",
    ];
    if (rsm) {
      const th = cat.map((x) => x.threshold).filter((v) => !Number.isNaN(v) && v !== null);
      paras.push(`Pada RSM, semua item berbagi Andrich threshold yang sama: ${th.map((t) => num(t)).join("; ")} ` +
        `logit (${!disT.length ? "naik berurutan" : "tidak seluruhnya naik berurutan"}).`);
    } else {
      const nItems = order.length;
      const nBad = unique(disT.map((x) => x.item)).length;
      paras.push(`Pada PCM, setiap item memiliki Andrich threshold sendiri; ${nBad} dari ${nItems} item ` +
        "memiliki disordered threshold.");
    }
    const actions = [];
    for (const item of unique(disT.map((x) => x.item))) {
      const block = cat.filter((x) => x.item === item);
      for (const g of disT.filter((x) => x.item === item)) {
        const k = g.category;
        const mid = block[k - 1].label;
        const left = k - 2 >= 0 ? block[k - 2].label : null;
        const right = block[k].label;
        const subject = rsm ? "Pada skala bersama" : `Pada item ${item}`;
        paras.push(`${subject}, threshold menuju kategori '${right}' (${num(block[k].threshold)}) lebih rendah ` +
          `daripada threshold menuju kategori '${mid}' (${num(block[k - 1].threshold)}), sehingga ` +
          `kategori '${mid}' jarang menjadi pilihan paling mungkin.`);
        const neighbours = left !== null ? `'${left}' atau '${right}'` : `'${right}'`;
        actions.push(`${subject}: pertimbangkan menggabungkan kategori '${mid}' dengan ${neighbours}, lalu ` +
          "jalankan ulang analisis; periksa juga apakah label kategori itu mudah dibedakan.");
      }
    }
    if (disA.length) {
      paras.push("Observed average (rata-rata measure person yang memilih tiap kategori) tidak naik berurutan pada " +
        `${where(disA)}: person yang memilih kategori lebih tinggi justru rata-rata berkemampuan lebih ` +
        "rendah. Ini mengindikasikan kategori dipahami tidak sesuai urutan yang dimaksud.");
      actions.push("Telaah label dan urutan kategori yang observed average-nya tidak naik; pastikan tidak ada " +
        "kesalahan pengodean arah skala.");
    }
    if (low.length) {
      const listing = names(low.map((x) => `'${x.label}'` + (rsm ? "" : ` pada ${x.item}`) + ` (${x.count} observasi)`), undefined, "kategori");
      paras.push(`Kategori dengan observasi sangat sedikit: ${listing}. Threshold di sekitarnya kurang stabil.`);
      actions.push("Gabungkan kategori yang jarang dipakai dengan kategori tetangganya bila secara makna masuk akal.");
    }
    if (hiOut.length) {
      const listing = names(hiOut.map((x) => `'${x.label}'` + (rsm ? "" : ` pada ${x.item}`) +
        ` (outfit ${num(x.outfit_mnsq)} vs expected ${num(x.outfit_expected)})`), undefined, "kategori");
      paras.push("Kategori dengan category outfit tinggi, yaitu dipakai secara lebih tidak terduga daripada " +
        `harapan model: ${listing}.`);
      actions.push("Periksa siapa yang memilih kategori dengan category outfit tinggi; pola ini dapat muncul " +
        "bila person memakai kategori tersebut secara tidak konsisten.");
    }
    const tech = [
      T("Categories below minimum count", String(low.length), `>= ${r.CATEGORY_MIN_COUNT} observasi per kategori`),
      T("Disordered thresholds", String(disT.length), "0"),
      T("Disordered observed averages", String(disA.length), "0"),
      T("High category outfit", String(hiOut.length), `>= ${num(r.CATEGORY_OUTFIT_MAX, 1)} dan melampaui harapan model (z > 1,645)`),
    ];
    if (rsm) {
      for (const x of cat) {
        tech.push(T(`  Category '${x.label}'`, `count ${x.count} (${pct(x.percent, 1)}), observed average ${num(x.avg_measure)}, ` +
          `outfit ${num(x.outfit_mnsq)} (exp. ${num(x.outfit_expected)}), ` +
          `Andrich threshold ${num(x.threshold)} (SE ${num(x.threshold_se)})`, ""));
      }
    }
    const section = { key: "categories", title: "Category Functioning", status, paragraphs: paras, actions, technical: tech,
      references: refs("linacre_2002_categories", "andrich_1978", "masters_1982", "linacre_winsteps_manual") };
    return [{ key: "categories", title: "Category Functioning", status, sentence }, section];
  }

  function peq(p) { const t = pval(p); return t.startsWith("<") ? t : `= ${t}`; }

  function dif(res) {
    const r = R(), d = res.dif;
    const title = "Differential Item Functioning (DIF)";
    if (!d || !d.length) {
      const section = { key: "dif", title, status: r.GRAY, paragraphs: ["Pilih kolom grup dengan tepat dua kategori (misalnya jenis kelamin) untuk menjalankan " +
        "analisis DIF."], actions: [], technical: [], references: [] };
      return [{ key: "dif", title: "DIF", status: r.GRAY,
        sentence: "DIF tidak dianalisis (kolom grup tidak dipilih atau tidak memiliki tepat dua kategori)." }, section];
    }
    const flagged = d.filter((x) => x.flag_dif);
    const big = flagged.filter((x) => x.ets_category === "C");
    const ga = d[0].group_a, gb = d[0].group_b;
    const harder = (x) => (x.contrast > 0 ? ga : gb);
    let status, sentence;
    if (big.length) {
      status = r.RED;
      sentence = `${big.length} item menunjukkan DIF besar (ETS category C) dan perlu ditelaah isinya: ` +
        `${names(big.map((x) => x.item))}.`;
    } else if (flagged.length) {
      status = r.YELLOW;
      sentence = `${flagged.length} item menunjukkan DIF yang perlu ditelaah: ${names(flagged.map((x) => x.item))}.`;
    } else {
      status = r.GREEN;
      sentence = `Tidak ada item yang menunjukkan DIF bermakna antara kelompok ${ga} dan ${gb}.`;
    }
    const paras = [
      "DIF terjadi bila dua orang dengan kemampuan yang sama, tetapi dari kelompok berbeda, memiliki peluang " +
      "berbeda untuk menjawab benar sebuah item, seperti timbangan yang berat sebelah. Person measure setiap " +
      "person dikunci (anchored), lalu item measure dihitung ulang terpisah untuk tiap kelompok; selisih " +
      "keduanya disebut DIF contrast.",
    ];
    if (flagged.length) {
      const detail = flagged.slice(0, MAX()).map((x) => `${x.item} lebih sulit bagi kelompok ${harder(x)} (DIF contrast ${num(Math.abs(x.contrast))} logit, ` +
        `t = ${num(Math.abs(x.t))}, ETS category ${x.ets_category})`).join("; ");
      paras.push(`Item yang ditandai: ${detail}.`);
      paras.push("DIF adalah tanda untuk menelaah isi item, bukan bukti otomatis bahwa item itu bias. Perbedaan dapat " +
        "bersumber dari konteks budaya, pilihan kata, atau pengalaman yang lebih akrab bagi satu kelompok, " +
        "tetapi juga dapat mencerminkan perbedaan pembelajaran yang memang nyata.");
    }
    const nA = Math.max(...d.map((x) => x.n_a)), nB = Math.max(...d.map((x) => x.n_b));
    paras.push(`Analisis ini melibatkan sekitar ${nA} person kelompok ${ga} dan ${nB} person kelompok ${gb}. Pada sampel ` +
      "kecil, DIF yang nyata dapat terlewat; pada sampel sangat besar, perbedaan kecil pun dapat signifikan, " +
      "sehingga besar DIF contrast (logit) lebih penting daripada nilai t.");
    const actions = [];
    if (flagged.length) {
      actions.push(`Minta panel ahli menelaah isi ${names(flagged.map((x) => x.item))} dari sudut bahasa, konteks, dan ` +
        "keakraban pengalaman bagi tiap kelompok.");
      actions.push("Bila ditemukan sumber bias yang masuk akal, revisi atau ganti item tersebut.");
    }
    const count = (c) => d.filter((x) => x.ets_category === c).length;
    const tech = [
      T("Groups (A / B)", `${ga} / ${gb}`, "DIF contrast = measure A - measure B"),
      T("Flagging criterion", `DIF contrast mutlak >= ${num(r.DIF_CONTRAST_MIN, 1)} dan t mutlak > ` +
        `${num(res.settings.dif_t_min, 1)}`,
        `Draba (1977): t > ${num(r.DIF_T_MIN, 1)}; t > ${num(r.DIF_T_MIN_MANY_ITEMS, 1)} bila lebih ` +
        `dari ${r.DIF_MANY_ITEMS} item`),
      T("ETS category (A / B / C)", `${count("A")} / ${count("B")} / ${count("C")}`,
        `C: DIF mutlak >= ${num(r.DIF_ETS_C)} dan bermakna melampaui ${num(r.DIF_ETS_B)} (p < 0,05)`),
    ];
    for (const x of flagged) {
      tech.push(T(`  ${x.item}`, `${num(x.measure_a)} vs ${num(x.measure_b)}; DIF contrast ${num(x.contrast)} ` +
        `(Joint SE ${num(x.joint_se)}), t(${num(x.df, 0)}) = ${num(x.t)}, ` +
        `p ${peq(x.p)}`, ""));
    }
    const section = { key: "dif", title, status, paragraphs: paras, actions, technical: tech,
      references: refs("draba_1977", "zwick_1999", "welch_1947", "linacre_winsteps_manual") };
    return [{ key: "dif", title: "DIF", status, sentence }, section];
  }

  function interpret(res) {
    const parts = [reliability(res), itemFit(res), dimensionality(res), targeting(res), categories(res), dif(res)];
    return {
      model: res.model, modelName: TEXT.modelNames[res.model],
      lights: parts.map((p) => p[0]), intro: intro(res.model), sections: parts.map((p) => p[1]),
      cautions: res.issues.filter((i) => i.level === "warning").map((i) => i.message),
    };
  }

  const DOTS = { hijau: "🟢", kuning: "🟡", merah: "🔴", abu: "⚪" };

  function summaryMarkdown(it) {
    const lines = [`## Ringkasan 1 Menit (${it.modelName})`, ""];
    for (const c of it.cautions) if (c.includes("TIDAK konvergen")) lines.push(`> ${c}`, "");
    for (const l of it.lights) lines.push(`- ${DOTS[l.status]} **${l.title}** (${TEXT.lightStatus[l.status]}): ${l.sentence}`);
    return lines.join("\n") + "\n";
  }

  function toMarkdown(it, technical = true) {
    let out = [summaryMarkdown(it), "## Penjelasan", ""];
    out = out.concat(it.intro.map((p) => p + "\n"));
    if (it.cautions.length) out = out.concat(["### Catatan data", ""], it.cautions.map((c) => `- ${c}`), [""]);
    for (const sec of it.sections) {
      out.push(`### ${sec.title}`, "");
      out = out.concat(sec.paragraphs.map((p) => p + "\n"));
      if (sec.actions.length) out = out.concat(["**Saran tindakan:**", ""], sec.actions.map((a) => `- ${a}`), [""]);
      if (technical && sec.technical.length) {
        out.push("<details><summary>Detail teknis</summary>", "", "| Statistik | Nilai | Kriteria |", "|---|---|---|");
        out = out.concat(sec.technical.map((t) => `| ${t.label.trim()} | ${t.value} | ${t.criterion} |`));
        if (sec.references.length) out = out.concat(["", "Rujukan:", ""], sec.references.map((x) => `- ${x}`));

    const nChance = rows.filter((r) => r.flag_chance).length;

    // keterkaitan jumlah butir dijawab dengan measure
    const cnt = res.persons.map((p) => p.count), meas = res.persons.map((p) => p.measure);
    const pc = res.persons.map((p) => (p.max_score > 0 ? p.score / p.max_score : NaN));
    const fin = res.persons.filter((p) => isF(p.measure)).length;
    return {
      rows, method: dich ? "lz*" : "MNSQ+ZSTD", nOptions: k,
      n_nonextreme: nonExt.length, n_underfit: nUnder, n_overfit: nOver, n_classic: nClassic, n_chance: nChance,
      pct_underfit: 100 * nUnder / Math.max(nonExt.length, 1), pct_classic: 100 * nClassic / Math.max(nonExt.length, 1),
      expected_false_positive: dich ? 0.05 * nonExt.length : NaN,
      lz_mean: mean(lzs), lz_sd: sd(lzs, 1),
      r_answered_measure: pearson(cnt, meas), rho_answered_measure: spearman(cnt, meas),
      p_answered_measure: corrP(pearson(cnt, meas), fin), r_answered_pcorrect: pearson(cnt, pc),
      cv_answered: sd(cnt.filter(isF)) / Math.max(mean(cnt.filter(isF)), 1e-9),
    };
  }

  /** Ringkasan yang dibandingkan pada analisis sensitivitas. */
  function snapshot(res) {
    const flags = itemFlags(res);
    return {
      n_persons: res.summary.n_persons, person_reliability: res.summary.person_reliability, item_reliability: res.summary.item_reliability,
      person_sd: res.summary.person.sd, eigenvalue: res.dimensionality.first_contrast_eigenvalue,
      n_items_flagged: flags.rows.filter((r) => r.status === "serius" || r.status === "telaah").length,
      measures: new Map(res.items.filter((r) => !r.extreme).map((r) => [r.item, r.measure])),
    };
  }

  /** Jalankan ulang analisis tanpa kelompok person tertentu; bandingkan berdampingan. */
  async function sensitivity(res, prep, scenarios, opts = {}) {
    const base = snapshot(res);
    const out = [{ scenario: "Semua person", excluded: 0, ...base }];
    for (const sc of scenarios) {
      const drop = new Set(sc.persons);
      if (!drop.size) { out.push({ scenario: sc.label, excluded: 0, skipped: true }); continue; }
      const rows = prep.personIds.map((id, n) => (drop.has(id) ? -1 : n)).filter((n) => n >= 0);
      await tick();
      try {
        const p2 = prepFromRaw(prep, prep.raw, rows);
        const r2 = E.runAnalysis(p2, res.model, { strictFit: res.settings.strict_fit, runDif: false, ...(opts.engine || {}) });
        out.push({ scenario: sc.label, excluded: drop.size, ...snapshot(r2) });
      } catch (err) {
        out.push({ scenario: sc.label, excluded: drop.size, error: err.message || String(err) });
      }
    }
    for (const row of out.slice(1)) {
      if (!row.measures) continue;
      const d = [], a = [], b = [];
      for (const [k, v] of base.measures) if (row.measures.has(k)) { d.push(row.measures.get(k) - v); a.push(v); b.push(row.measures.get(k)); }
      row.mean_abs_shift = mean(d.map(Math.abs));
      let mx = 0, who = null;
      for (const [k, v] of base.measures) if (row.measures.has(k)) { const s = Math.abs(row.measures.get(k) - v); if (s > mx) { mx = s; who = k; } }
      row.max_abs_shift = mx; row.max_shift_item = who; row.r_measures = pearson(a, b);
    }
    out.forEach((r) => delete r.measures);
    return out;
  }

  // ------------------------------------------------------------------------------------
  // 3. Diagnostik butir
  // ------------------------------------------------------------------------------------
  function itemFlags(res) {
    const [lo, hi] = res.settings.mnsq_range;
    const RR = root.RASCH_TEXT ? root.RASCH_TEXT.rules : { MNSQ_DEGRADING: 2.0, PTMEASURE_MIN: 0 };
    const rows = res.items.map((x) => {
      const n = x.count;
      const gap = x.ptmea_exp - x.ptmea_obs;
      const zgap = isF(gap) && n > 3 ? (Math.atanh(Math.max(Math.min(x.ptmea_exp, 0.999), -0.999)) - Math.atanh(Math.max(Math.min(x.ptmea_obs, 0.999), -0.999))) * Math.sqrt(n - 3) : NaN;
      const zUnder = x.infit_zstd > RULES.ZSTD_SIG || x.outfit_zstd > RULES.ZSTD_SIG;
      const mnsqUnder = x.infit_mnsq > hi || x.outfit_mnsq > hi;
      const mnsqOver = x.infit_mnsq < lo || x.outfit_mnsq < lo;
      const zOver = x.infit_zstd < -RULES.ZSTD_SIG || x.outfit_zstd < -RULES.ZSTD_SIG;
      const degrading = (x.infit_mnsq > RR.MNSQ_DEGRADING && x.infit_zstd > RULES.ZSTD_SIG) || (x.outfit_mnsq > RR.MNSQ_DEGRADING && x.outfit_zstd > RULES.ZSTD_SIG);
      const negSig = x.ptmea_obs < RR.PTMEASURE_MIN && zgap > RULES.PTMEA_GAP_Z;
      const reasons = [];
      if (degrading) reasons.push("MNSQ > " + RR.MNSQ_DEGRADING + " dan ZSTD > 2");
      if (negSig) reasons.push("PTMEA negatif, jauh di bawah harapan");
      const reviewMnsq = mnsqUnder && zUnder;
      const reviewZgap = zUnder && gap >= RULES.PTMEA_GAP_WITH_ZSTD;
      const reviewGap = gap >= RULES.PTMEA_GAP_ALONE && zgap > RULES.PTMEA_GAP_Z;
      if (reviewMnsq) reasons.push("MNSQ di atas rentang dan ZSTD > 2");
      if (reviewZgap && !reviewMnsq) reasons.push("ZSTD > 2 disertai PTMEA di bawah harapan");
      if (reviewGap) reasons.push("PTMEA jauh di bawah harapan (daya beda rendah)");
      let status = "wajar";
      if (x.extreme) status = "extreme";
      else if (degrading || negSig) status = "serius";
      else if (reviewMnsq || reviewZgap || reviewGap) status = "telaah";
      else if (mnsqOver && zOver) { status = "overfit"; reasons.push("MNSQ di bawah rentang dan ZSTD < -2 (tidak merusak)"); }
      else if (mnsqUnder || mnsqOver || x.ptmea_obs < RR.PTMEASURE_MIN) { status = "catatan"; reasons.push("hanya satu kriteria terpenuhi (tidak bermakna secara statistik)"); }
      return { item: x.item, measure: x.measure, count: n, infit_mnsq: x.infit_mnsq, infit_zstd: x.infit_zstd, outfit_mnsq: x.outfit_mnsq,
        outfit_zstd: x.outfit_zstd, ptmea_obs: x.ptmea_obs, ptmea_exp: x.ptmea_exp, ptmea_gap: gap, ptmea_gap_z: zgap,
        status, reasons: reasons.join("; "), flag_classic: !!(x.flag_misfit || x.flag_negative_ptmea) };
    });
    return { rows, classic: rows.filter((r) => r.flag_classic).map((r) => r.item) };
  }

  /** Petunjuk tebakan: korelasi outfit dengan kesulitan dan sumber kejutan. */
  function guessingSignals(res) {
    const c = core(res), est = res.items.filter((x) => !x.extreme);
    const rho = spearman(est.map((x) => x.measure), est.map((x) => x.outfit_mnsq));
    const rhoZ = spearman(est.map((x) => x.measure), est.map((x) => x.outfit_zstd));
    const out = { rho_outfit_measure: rho, p_rho: corrP(rho, est.length), rho_outfitz_measure: rhoZ, n_items: est.length };
    if (res.model === "dichotomous") {
      let lucky = 0, careless = 0, low = 0, high = 0;
      const perItem = c.names.map(() => ({ lucky: 0, careless: 0 }));
      for (let a = 0; a < c.N; a++) for (let i = 0; i < c.L; i++) {
        const q = a * c.L + i; if (!c.obs[q]) continue;
        const P = c.mom.E[q];
        if (P < 0.2) { low++; if (c.X0[q] === 1) { lucky++; perItem[i].lucky++; } }
        if (P > 0.8) { high++; if (c.X0[q] === 0) { careless++; perItem[i].careless++; } }
      }
      Object.assign(out, { unexpected_success: lucky, low_prob_cells: low, unexpected_failure: careless, high_prob_cells: high,
        pct_unexpected_success: 100 * lucky / Math.max(low, 1), pct_unexpected_failure: 100 * careless / Math.max(high, 1) });
      let exp = 0, var_ = 0; // jumlah sukses harapan pada sel P < 0,2
      for (let a = 0; a < c.N; a++) for (let i = 0; i < c.L; i++) { const q = a * c.L + i; if (c.obs[q] && c.mom.E[q] < 0.2) { exp += c.mom.E[q]; var_ += c.mom.E[q] * (1 - c.mom.E[q]); } }
      out.expected_success_low = exp; out.z_success_low = var_ > 0 ? (lucky - exp) / Math.sqrt(var_) : NaN;
      out.per_item = c.names.map((nm, i) => ({ item: nm, ...perItem[i] }));
    }
    out.pattern = isF(rho) && rho >= RULES.GUESS_RHO && out.p_rho < 0.05;
    return out;
  }

  /** Tailored analysis (Andrich, Marais & Humphry, 2012): respons berpeluang benar < c dibuang. */
  async function tailoredAnalysis(res, prep, cutoff) {
    if (res.model !== "dichotomous") return null;
    const c = core(res);
    const raw = prep.raw.map((r) => r.slice());
    const itemPrep = new Map(prep.itemNames.map((n, i) => [n, i]));
    let removed = 0;
    for (let a = 0; a < c.N; a++) {
      const n = c.ep[a];
      for (let k = 0; k < c.L; k++) {
        const q = a * c.L + k; if (!c.obs[q]) continue;
        if (c.mom.E[q] < cutoff) { raw[n][itemPrep.get(c.names[k])] = NaN; removed++; }
      }
    }
    await tick();
    let r2;
    try { r2 = E.runAnalysis(prepFromRaw(prep, raw), "dichotomous", { runDif: false, strictFit: res.settings.strict_fit }); }
    catch (err) { return { cutoff, removed, error: err.message || String(err) }; }
    const orig = new Map(res.items.filter((x) => !x.extreme).map((x) => [x.item, x]));
    const tail = new Map(r2.items.filter((x) => !x.extreme).map((x) => [x.item, x]));
    const common = [...orig.keys()].filter((k) => tail.has(k));
    const easy = common.slice().sort((a, b) => orig.get(a).measure - orig.get(b).measure).slice(0, Math.max(2, Math.floor(common.length / 3)));
    const shift = mean(easy.map((k) => orig.get(k).measure)) - mean(easy.map((k) => tail.get(k).measure));
    const rows = common.map((k) => {
      const o = orig.get(k), t = tail.get(k);
      const tm = t.measure + shift, d = tm - o.measure;
      const se = Math.sqrt(Math.abs(t.se * t.se - o.se * o.se));
      const z = se > 0 ? d / se : NaN;
      return { item: k, measure_original: o.measure, measure_tailored: tm, difference: d, se_difference: se, z,
        flag_guessing: d >= RULES.TAILOR_MIN_DIFF && z > 1.96, count_original: o.count, count_tailored: t.count };
    });
    return { cutoff, removed, pct_removed: 100 * removed / Math.max(c.obs.reduce((s, v) => s + v, 0), 1), anchor_items: easy, shift, rows,
      n_flagged: rows.filter((r) => r.flag_guessing).length, person_reliability_tailored: r2.summary.person_reliability };
  }

  /** Normalisasi jawaban mentah: huruf besar, tanpa spasi, opsi ganda diurutkan ("d;b;" -> "B;D"). */
  function normAnswer(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === "number") return Number.isNaN(v) ? null : String(v);
    let s = String(v).trim().toUpperCase();
    if (!s) return null;
    const parts = s.split(/[;,|]+/).map((x) => x.trim()).filter(Boolean);
    if (parts.length > 1) return Array.from(new Set(parts)).sort().join(";");
    return parts[0] || null;
  }
  const KEY_ROW = /^(kunci|kunci jawaban|key|answer key|kunci_jawaban)$/i;
  /** Cari baris kunci (nilai ID/kolom pertama "KUNCI"/"KEY"). */
  function findKeyRow(table, idCol) {
    const cols = [idCol, table.columns[0]].filter((c) => c !== null && c !== undefined);
    for (const col of cols) {
      const j = table.columns.indexOf(col); if (j < 0) continue;
      const k = table.rows.findIndex((r) => r[j] !== null && r[j] !== undefined && KEY_ROW.test(String(r[j]).trim()));
      if (k >= 0) return k;
    }
    return -1;
  }
  /** Skor jawaban mentah dengan kunci; kunci alternatif dipisah "/" (mis. "A/C"). */
  function scoreWithKey(table, keyRow, itemCols) {
    const keyCells = table.rows[keyRow];
    const keys = {}, raw = {};
    const cols = itemCols.map((c) => table.columns.indexOf(c));
    itemCols.forEach((c, k) => { keys[c] = String(keyCells[cols[k]] ?? "").split("/").map(normAnswer).filter(Boolean); });
    const rows = table.rows.filter((_, n) => n !== keyRow);
    itemCols.forEach((c) => { raw[c] = []; });
    const scored = rows.map((r) => r.map((v, j) => {
      const k = cols.indexOf(j); if (k < 0) return v;
      const a = normAnswer(v); raw[itemCols[k]].push(a);
      if (a === null) return null;
      return keys[itemCols[k]].includes(a) ? 1 : 0;
    }));
    return { table: { columns: table.columns.slice(), rows: scored }, keys, raw };
  }

  /** Analisis distraktor dari jawaban mentah. */
  function distractors(res, prep, answers, nOptions) {
    const measure = res.persons.map((p) => p.measure);
    const rowsOut = [], items = [];
    for (const name of res.coded.itemNames) {
      const resp = answers.raw[name]; if (!resp) continue;
      const keys = answers.keys[name] || [];
      const vals = prep.rowIndex.map((r) => resp[r]);
      const idx = []; vals.forEach((v, n) => { if (v !== null && isF(measure[n])) idx.push(n); });
      const opts = Array.from(new Set(idx.map((n) => vals[n]))).sort();
      const singles = opts.filter((o) => !o.includes(";"));
      const kOpt = nOptions && nOptions >= 2 ? nOptions : Math.max(singles.length, 2);
      const y = idx.map((n) => measure[n]);
      const optRows = opts.map((o) => {
        const ind = idx.map((n) => (vals[n] === o ? 1 : 0));
        const cnt = ind.reduce((s, v) => s + v, 0);
        const mm = mean(idx.filter((_, k) => ind[k]).map((n) => measure[n]));
        return { item: name, option: o, key: keys.includes(o), count: cnt, proportion: cnt / Math.max(idx.length, 1), mean_measure: mm, r_pb: pearson(ind, y) };
      });
      const keyRows = optRows.filter((r) => r.key);
      const rKey = keyRows.length ? Math.max(...keyRows.map((r) => (isF(r.r_pb) ? r.r_pb : -Infinity))) : NaN;
      const pKey = keyRows.reduce((s, r) => s + r.proportion, 0);
      const better = optRows.filter((r) => !r.key && isF(r.r_pb) && r.r_pb > Math.max(isF(rKey) ? rKey : -1, 0.05) && r.count >= 5);
      const chance = 1 / kOpt;
      const pBelow = binomUpper(Math.round(pKey * idx.length) + 1, idx.length, chance); // P(X > obs | chance)
      const flags = [];
      if (!keyRows.length) flags.push("kunci tidak ditemukan di antara jawaban");
      if (isF(rKey) && rKey <= 0) flags.push("korelasi kunci dengan measure tidak positif");
      if (better.length) flags.push(`distraktor ${better.map((r) => r.option).join(", ")} lebih diskriminatif daripada kunci (dugaan kunci keliru)`);
      if (pKey < chance) flags.push(`proporsi benar ${(100 * pKey).toFixed(0)}% di bawah peluang tebakan ${(100 * chance).toFixed(0)}%`);
      optRows.forEach((r) => rowsOut.push(r));
      items.push({ item: name, key: keys.join("/"), n: idx.length, n_options: kOpt, p_correct: pKey, r_key: rKey, chance,
        p_chance_or_lower: 1 - pBelow, flag: flags.length > 0, flags: flags.join("; ") });
    }
    return { options: rowsOut, items };
  }

  /** Item yang proporsi benarnya di bawah peluang tebakan (data terskor, jumlah opsi diketahui). */
  function belowChance(res, nOptions) {
    if (res.model !== "dichotomous" || !(nOptions >= 2)) return [];
    const ch = 1 / nOptions;
    return res.items.filter((x) => x.count > 0 && x.score / x.count < ch).map((x) => ({ item: x.item, p: x.score / x.count, chance: ch }));
  }

  // ------------------------------------------------------------------------------------
  // 4. Simulasi data yang patuh model (ambang eigenvalue/Q3, pemulihan parameter)
  // ------------------------------------------------------------------------------------
  async function simulate(res, prep, reps, opts = {}) {
    const coded = res.coded, jm = res.jmle;
    const seed = opts.seed ?? 20240917;
    const rand = rng(seed);
    const persons = [], items = [];
    coded.personExtreme.forEach((v, n) => { if (isF(jm.theta[n])) persons.push(n); });
    coded.itemExtreme.forEach((v, i) => { if (v !== 2 && isF(jm.b[i])) items.push(i); });
    const Mall = Math.max(...coded.m);
    const theta = persons.map((n) => jm.theta[n]);
    const delta = items.map((i) => jm.delta[i]);
    const mom = E.moments(theta, delta, Mall);
    const K = Mall + 1, Lp = items.length;
    const genB = new Map(items.map((i) => [coded.itemNames[i], jm.b[i]]));
    const fake = { itemNames: items.map((i) => coded.itemNames[i]), personIds: persons.map((n) => coded.personIds[n]), groupValues: null,
      rowIndex: persons.map((n) => n), raw: null };
    const out = { reps: 0, failed: 0, seed, eig: [], q3rel: [], q3max: [], prel: [], irel: [], flagged: [], recov: new Map(), lzSd: [] };
    for (let r = 0; r < reps; r++) {
      if (opts.shouldCancel && opts.shouldCancel()) break;
      const raw = persons.map((n, a) => items.map((i, c) => {
        if (Number.isNaN(coded.X[n][i])) return NaN;
        const base = (a * Lp + c) * K;
        let u = rand(), k = 0, acc = mom.P[base];
        while (u > acc && k < coded.m[i]) { k++; acc += mom.P[base + k]; }
        return k;
      }));
      fake.raw = raw;
      try {
        const p2 = prepFromRaw(fake, raw);
        const r2 = E.runAnalysis(p2, res.model, { runDif: false, strictFit: res.settings.strict_fit });
        out.eig.push(r2.dimensionality.first_contrast_eigenvalue);
        out.q3rel.push(r2.q3.max - r2.q3.mean); out.q3max.push(r2.q3.max);
        out.prel.push(r2.summary.person_reliability); out.irel.push(r2.summary.item_reliability);
        const fl = itemFlags(r2).rows.filter((x) => !x.extreme);
        out.flagged.push(fl.filter((x) => x.status === "serius" || x.status === "telaah").length / Math.max(fl.length, 1));
        // pemulihan: estimasi (terkoreksi bias) vs parameter pembangkit, dipusatkan pada item bersama
        const est = r2.items.filter((x) => !x.extreme && genB.has(x.item));
        const gm = mean(est.map((x) => genB.get(x.item))), em = mean(est.map((x) => x.measure));
        const emU = mean(est.map((x) => x.measure / r2.jmle.biasFactor));
        for (const x of est) {
          if (!out.recov.has(x.item)) out.recov.set(x.item, { err: [], errU: [], cover: 0, n: 0 });
          const t = genB.get(x.item) - gm, e = x.measure - em, eu = x.measure / r2.jmle.biasFactor - emU;
          const rec = out.recov.get(x.item);
          rec.err.push(e - t); rec.errU.push(eu - t); rec.n++;
          if (Math.abs(e - t) <= 1.96 * x.se) rec.cover++;
        }
        if (r2.model === "dichotomous") {
          const pq = personQuality(r2, null, {});
          out.lzSd.push(pq.lz_sd);
        }
        out.reps++;
      } catch (err) { out.failed++; }
      if (opts.progress) opts.progress(r + 1, reps);
      await tick();
    }
    const q = RULES.SIM_QUANTILE;
    const recRows = [...out.recov.entries()].map(([item, v]) => ({ item, generating: genB.get(item), bias: mean(v.err), rmse: Math.sqrt(mean(v.err.map((e) => e * e))),
      bias_uncorrected: mean(v.errU), coverage: v.cover / Math.max(v.n, 1), n: v.n }));
    return {
      reps: out.reps, failed: out.failed, seed,
      eig_p95: quantile(out.eig, q), eig_p99: quantile(out.eig, 0.99), eig_mean: mean(out.eig), eig_max: Math.max(...out.eig),
      q3rel_p95: quantile(out.q3rel, q), q3rel_p99: quantile(out.q3rel, 0.99), q3max_p95: quantile(out.q3max, q),
      person_rel_mean: mean(out.prel), item_rel_mean: mean(out.irel), flagged_rate: mean(out.flagged),
      lz_sd_mean: mean(out.lzSd),
      recovery: recRows, recovery_bias: mean(recRows.map((r) => Math.abs(r.bias))), recovery_rmse: mean(recRows.map((r) => r.rmse)),
      recovery_bias_uncorrected: mean(recRows.map((r) => Math.abs(r.bias_uncorrected))), recovery_coverage: mean(recRows.map((r) => r.coverage)),
      eig_values: out.eig, q3rel_values: out.q3rel,
    };
  }

  // ------------------------------------------------------------------------------------
  // 5. Dimensionalitas lanjutan
  // ------------------------------------------------------------------------------------
  /** Measure person dari subset item (item dijangkarkan). */
  function subsetMeasures(res, itemIdxCore) {
    const c = core(res), jm = res.jmle;
    const k = itemIdxCore.length;
    const obs = new Uint8Array(c.N * k), target = new Float64Array(c.N), info = [];
    for (let a = 0; a < c.N; a++) {
      let s = 0, mx = 0, cnt = 0;
      itemIdxCore.forEach((i, j) => { const q = a * c.L + i; if (c.obs[q]) { obs[a * k + j] = 1; s += c.X0[q]; mx += c.m[i]; cnt++; } });
      target[a] = s <= 0 ? E.EXTREME_SCORE_ADJUSTMENT : s >= mx ? mx - E.EXTREME_SCORE_ADJUSTMENT : s;
      info.push({ cnt, extreme: cnt === 0 || s <= 0 || s >= mx });
    }
    void jm;
    const sol = E.solvePersons(itemIdxCore.map((i) => c.delta[i]), obs, Array.from(target), c.M);
    return info.map((x, a) => ({ measure: x.cnt ? sol.theta[a] : NaN, se: x.cnt ? sol.se[a] : NaN, valid: x.cnt > 0 && !x.extreme }));
  }

  function compareSubsets(res, A, B, labelA, labelB) {
    const ma = subsetMeasures(res, A), mb = subsetMeasures(res, B);
    const keep = []; ma.forEach((x, a) => { if (x.valid && mb[a].valid) keep.push(a); });
    const xa = keep.map((a) => ma[a].measure), xb = keep.map((a) => mb[a].measure);
    const ra = E.separationStatistics(xa, keep.map((a) => ma[a].se), null).model_reliability;
    const rb = E.separationStatistics(xb, keep.map((a) => mb[a].se), null).model_reliability;
    const r = pearson(xa, xb);
    const rdis = ra > 0 && rb > 0 ? r / Math.sqrt(ra * rb) : NaN;
    let sig = 0;

  function dimensionExtras(res, blocks, sim) {

    const coreIdx = new Map(c.names.map((n, i) => [n, i]));
    const blockRows = [];
    if (blocks.detected) {
      for (const b of blocks.blocks) {
        const ls = b.names.map((n) => loadMap.get(n)).filter(isF);

  }

  async function calibrateBlocks(prep, model, blocks, opts = {}) {
    const rows = [];
    const pos = new Map(prep.itemNames.map((n, i) => [n, i]));
    for (const b of blocks.blocks) {
      await tick();
      try {
        const idx = b.names.map((n) => pos.get(n)).filter((v) => v !== undefined);
        const p2 = prepFromRaw(prep, prep.raw, null, idx);
        const m2 = model === "dichotomous" || p2.responseType !== "dichotomous" ? model : "dichotomous";
        const r2 = E.runAnalysis(p2, m2, { runDif: false, strictFit: opts.strictFit });

          person_separation: r2.summary.person_separation, item_reliability: r2.summary.item_reliability,

  // ------------------------------------------------------------------------------------
  // 6. Reliabilitas dan targeting
  // ------------------------------------------------------------------------------------
  /** Informasi maksimum setiap item (puncak fungsi informasi item). */
  function maxItemInfo(delta, M) {
    const fin = Array.from(delta).filter(isF);
    const lo = Math.min(...fin) - 4, hi = Math.max(...fin) + 4;
    const grid = []; for (let t = lo; t <= hi; t += 0.01) grid.push(t);
    const mom = E.moments(grid, [delta], M);
    let mx = 0; for (let g = 0; g < grid.length; g++) mx = Math.max(mx, mom.W[g]);
    return mx;
  }

  function reliabilityTargeting(res) {
    const c = core(res), s = res.summary;
    const maxInfo = c.delta.map((d) => maxItemInfo(d, c.M));
    const eff = [], semMin = [], answered = [];
    for (let a = 0; a < c.N; a++) {
      let I = 0, Imax = 0, n = 0;
      for (let i = 0; i < c.L; i++) { const q = a * c.L + i; if (c.obs[q]) { I += c.mom.W[q]; Imax += maxInfo[i]; n++; } }
      eff.push(Imax > 0 ? I / Imax : NaN); semMin.push(Imax > 0 ? 1 / Math.sqrt(Imax) : NaN); answered.push(n);
    }

    const relMax = trueVarM > 0 ? trueVarM / (trueVarM + rmseMin * rmseMin) : NaN;

    const proj = (target) => (isF(R) && R > 0 && R < 1 ? Lbar * (target / (1 - target)) / (R / (1 - R)) : NaN);
    const completeShare = s.n_persons ? s.alpha_n / s.n_persons : NaN;
    const effF = eff.filter(isF);
    return {
      observed_sd: p.sd, true_sd: p.real_true_sd, model_true_sd: p.model_true_sd, rmse_real: p.real_rmse, rmse_model: p.model_rmse,
      reliability_real: R, reliability_model: p.model_reliability, rmse_min: rmseMin, reliability_max: relMax,
      mean_answered: Lbar, items_for_080: proj(0.8), items_for_090: proj(0.9), true_var: trueVar,
      error_share: p.sd > 0 ? (p.real_rmse ** 2) / (p.sd ** 2) : NaN,
      alpha_complete_n: s.alpha_n, alpha_complete_share: completeShare, alpha_selection_warning: isF(completeShare) && completeShare < RULES.KR20_COMPLETE_MIN,
      info_eff_median: median(effF), info_eff_p25: quantile(effF, 0.25), info_eff_p75: quantile(effF, 0.75),

  }

  // ------------------------------------------------------------------------------------
  // 7. DIF lanjutan
  // ------------------------------------------------------------------------------------
  /** Item measure per kelompok dengan theta person dijangkarkan (padanan difAnalysis per kelompok). */
  function groupItemMeasures(c, tauE, sel, theta) {

    const has = [], target = [], extreme = [];
    for (let i = 0; i < L; i++) {
      const mx = n[i] * c.m[i];
      extreme.push((score[i] <= 0 || score[i] >= mx) && n[i] > 0);
      target.push(score[i] <= 0 ? E.EXTREME_SCORE_ADJUSTMENT : score[i] >= mx ? mx - E.EXTREME_SCORE_ADJUSTMENT : score[i]);
      if (n[i] > 0) has.push(i);
    }

      sel.forEach((a, r) => has.forEach((i, j) => { if (c.obs[a * L + i]) ob[r * k + j] = 1; }));
      const sol = E.solveItemLocations(sel.map((a) => theta[a]), ob, has.map((i) => tauE[i]), has.map((i) => c.m[i]), has.map((i) => target[i]), c.M);
      has.forEach((i, j) => { b[i] = sol.b[j]; se[i] = sol.se[j]; });

  }

  /** Theta person dari item jangkar (purifikasi). */
  function anchoredTheta(c, anchor) {
    const k = anchor.length, obs = new Uint8Array(c.N * k), target = new Float64Array(c.N);
    for (let a = 0; a < c.N; a++) {
      let s = 0, mx = 0;
      anchor.forEach((i, j) => { const q = a * c.L + i; if (c.obs[q]) { obs[a * k + j] = 1; s += c.X0[q]; mx += c.m[i]; } });
      target[a] = s <= 0 ? E.EXTREME_SCORE_ADJUSTMENT : s >= mx ? mx - E.EXTREME_SCORE_ADJUSTMENT : s;
    }
    return Array.from(E.solvePersons(anchor.map((i) => c.delta[i]), obs, Array.from(target), c.M).theta);
  }

  function welch(b1, se1, n1, b2, se2, n2) {

        tauSe = Array.from({ length: mod.M }, (_, j) => {
          const w = new Float64Array(mod.P); for (let k = 0; k < mod.M; k++) w[mod.L + k] = (k === j ? 1 : 0) - 1 / mod.M;
          return Math.sqrt(Math.max(quad(w), 0));
        });
      }
    }
    const jm = res.jmle;
    const items = mod.itemIdx.map((gi, i) => ({ item: res.coded.itemNames[gi], cmle: b[i], cmle_se: se[i], jmle: jm.itemMeasure[gi],
      jmle_uncorrected: jm.b[gi], difference: jm.itemMeasure[gi] - b[i] }));
    let tau = null;
    if (mod.model === "rsm") {
      const t = Array.from({ length: mod.M }, (_, j) => x[mod.L + j]), tm = t.reduce((s, v) => s + v, 0) / mod.M;
      const jt = jm.threshold[mod.itemIdx[0]];
      tau = t.map((v, j) => ({ threshold: j + 1, cmle: v - tm, cmle_se: tauSe ? tauSe[j] : NaN, jmle: jt[j] }));
    } else if (mod.model === "pcm") {
      const d = mod.deltas(x);
      items.forEach((row, i) => { row.cmle_thresholds = d[i].map((v) => v - lm - b[i]); row.jmle_thresholds = Array.from(jm.threshold[mod.itemIdx[i]]).slice(0, mod.m[i]); });
    }
    const a = items.map((r) => r.cmle), j = items.map((r) => r.jmle), ju = items.map((r) => r.jmle_uncorrected);
    const corr = (p, q) => { const mp = p.reduce((s, v) => s + v, 0) / p.length, mq = q.reduce((s, v) => s + v, 0) / q.length; let sx = 0, sy = 0, sxy = 0; p.forEach((v, k) => { sx += (v - mp) ** 2; sy += (q[k] - mq) ** 2; sxy += (v - mp) * (q[k] - mq); }); return { r: sxy / Math.sqrt(sx * sy), slope: sxy / sx }; };
    const cj = corr(a, j), cu = corr(a, ju);
    const rmsd = Math.sqrt(items.reduce((s, r) => s + r.difference ** 2, 0) / items.length);
    return {
      model: mod.model, converged: opt.converged, iterations: opt.iterations, loglik: -objective(mod, x, false, false).f,
      n_persons_used: mod.persons.length, n_items: mod.L, seconds: (Date.now() - t0) / 1000, se_available: !!cov,
      items, tau, r: cj.r, slope_jmle_on_cmle: cj.slope, slope_uncorrected_on_cmle: cu.slope, rmsd,
      max_abs_difference: Math.max(...items.map((r) => Math.abs(r.difference))),
    };
  }

  const api = { setEngine, estimate, estimateAsync, makeModel, evaluate, objective, polyMul, bfgs };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.RaschCMLE = api;
})(typeof window !== "undefined" ? window : globalThis);

<script>/* RaschLite: lapisan inferensi lintas indikator (khusus versi HTML).

  const ST = { GREEN: "hijau", YELLOW: "kuning", RED: "merah", GRAY: "abu", TENTATIVE: "tentatif" };

  const REFS = {
    ludlow_1999: "Ludlow, L. H., & O'Leary, M. (1999). Scoring omitted and not-reached items: Practical data analysis implications. Educational and Psychological Measurement, 59(4), 615-630.",
    snijders_2001: "Snijders, T. A. B. (2001). Asymptotic null distribution of person fit statistics with estimated person parameter. Psychometrika, 66(3), 331-342.",

    holland_1988: "Holland, P. W., & Thayer, D. T. (1988). Differential item performance and the Mantel-Haenszel procedure. In H. Wainer & H. I. Braun (Eds.), Test validity (pp. 129-145). Erlbaum.",
    rbg_1986: "Robins, J., Breslow, N., & Greenland, S. (1986). Estimators of the Mantel-Haenszel variance consistent in both sparse data and large-strata limiting models. Biometrics, 42(2), 311-323.",
    swaminathan_1990: "Swaminathan, H., & Rogers, H. J. (1990). Detecting differential item functioning using logistic regression procedures. Journal of Educational Measurement, 27(4), 361-370.",
    jodoin_2001: "Jodoin, M. G., & Gierl, M. J. (2001). Evaluating type I error and power rates using an effect size measure with the logistic regression procedure for DIF detection. Applied Measurement in Education, 14(4), 329-349.",
    bh_1995: "Benjamini, Y., & Hochberg, Y. (1995). Controlling the false discovery rate: A practical and powerful approach to multiple testing. Journal of the Royal Statistical Society: Series B, 57(1), 289-300.",
    andersen_1970: "Andersen, E. B. (1970). Asymptotic properties of conditional maximum-likelihood estimators. Journal of the Royal Statistical Society: Series B, 32(2), 283-301.",
    spearman_brown_1910: "Spearman, C. (1910). Correlation calculated from faulty data. British Journal of Psychology, 3(3), 271-295; Brown, W. (1910). Some experimental results in the correlation of mental abilities. British Journal of Psychology, 3(3), 296-322.",
    mantel_1959: "Mantel, N., & Haenszel, W. (1959). Statistical aspects of the analysis of data from retrospective studies of disease. Journal of the National Cancer Institute, 22(4), 719-748.",
  };
  const ref = (...keys) => keys.map((k) => REFS[k] || (TEXT.rules.REFERENCES[k] ?? k));

  const GLOSSARY = {
    not_reached: { term: "Not-reached vs omitted", short: "Kosong karena tidak sempat dikerjakan vs dilewati.", long: "Not-reached adalah butir kosong yang letaknya sesudah butir terakhir yang dijawab dalam satu blok, biasanya karena waktu habis. Omitted adalah butir kosong di tengah rentang yang sudah dikerjakan, biasanya karena person tidak tahu jawabannya. Keduanya memiliki makna berbeda sehingga perlakuannya juga sebaiknya berbeda (Ludlow & O'Leary, 1999)." },
    lz_star: { term: "lz* (person fit)", short: "Statistik person fit berbasis likelihood yang dikoreksi untuk theta estimasi.", long: "lz* membandingkan log-likelihood pola jawaban seseorang dengan harapannya, lalu distandardisasi dengan koreksi Snijders (2001) agar tetap mendekati distribusi normal baku walaupun theta diestimasi. Nilai di bawah -1,645 menandakan pola yang lebih tak terduga daripada wajar (underfit), misalnya menjawab acak atau menyontek; nilai positif besar menandakan pola yang terlalu rapi (overfit), yang tidak merusak pengukuran." },
    guttman: { term: "Guttman errors (G*)", short: "Banyaknya pasangan 'butir mudah salah, butir sulit benar'.", long: "Setiap pasangan butir dengan butir yang lebih mudah dijawab salah tetapi butir yang lebih sulit dijawab benar dihitung sebagai satu Guttman error. G* menormalkan jumlah itu menurut skor sehingga berada antara 0 dan 1." },
    mdc: { term: "Minimum detectable contrast", short: "DIF contrast terkecil yang dapat dideteksi dengan daya 80%.", long: "Dihitung dari joint SE kedua kelompok: (1,96 + 0,84) x joint SE. Bila nilainya lebih besar daripada ukuran DIF yang dianggap penting, tidak ditemukannya DIF belum berarti tidak ada DIF." },
    disattenuated: { term: "Disattenuated correlation", short: "Korelasi antar-measure dari dua gugus item setelah dikoreksi galat ukur.", long: "Korelasi measure person yang dihitung dari dua gugus item dibagi akar perkalian reliabilitas keduanya. Nilai mendekati 1 berarti kedua gugus mengukur hal yang sama; di bawah 0,71 berarti keduanya berbagi kurang dari separuh varians sejati." },
    smith_t: { term: "Smith's t-test", short: "Persentase person yang measure-nya berbeda bermakna antar-gugus item.", long: "Untuk setiap person, measure dari dua gugus item dibandingkan dengan uji t. Bila lebih dari 5% person berbeda bermakna (dengan batas bawah interval kepercayaan di atas 5%), data menunjukkan multidimensionalitas yang berdampak pada person (Smith, 2002)." },
    cmle: { term: "CMLE", short: "Conditional maximum likelihood: estimator item yang tidak bergantung pada estimasi person.", long: "CMLE mengondisikan likelihood pada raw score setiap person sehingga parameter person hilang dari persamaan dan estimasi item konsisten tanpa koreksi bias. Di RaschLite CMLE dipakai sebagai pembanding JMLE; selisih yang kecil memberi bukti bahwa koreksi bias JMLE memadai pada data Anda." },
    tailored: { term: "Tailored analysis", short: "Analisis ulang tanpa respons yang peluang benarnya sangat kecil.", long: "Andrich, Marais dan Humphry (2012) mengusulkan membuang respons dengan peluang benar menurut model di bawah batas c (misalnya 1/jumlah opsi), lalu mengestimasi ulang. Butir yang menjadi jauh lebih sulit setelah itu kemungkinan dipengaruhi tebakan." },
    info_eff: { term: "Information efficiency", short: "Informasi tes pada lokasi person dibandingkan maksimum yang mungkin.", long: "Untuk setiap person, informasi dari butir yang dijawab pada measure-nya dibagi informasi yang akan diperoleh bila setiap butir tepat sasaran. Nilai 1 berarti semua butir tepat di lokasi person." },
    mantel_haenszel: { term: "Mantel-Haenszel DIF", short: "Uji DIF nonparametrik dengan pencocokan pada kemampuan.", long: "Person dikelompokkan menurut measure, lalu peluang benar kedua kelompok dibandingkan di setiap strata. Delta MH (skala ETS) mengikuti klasifikasi A/B/C (Holland & Thayer, 1988)." },
    logistic_dif: { term: "Logistic regression DIF", short: "DIF uniform dan non-uniform melalui regresi logistik.", long: "Peluang benar dimodelkan dari measure, kelompok, dan interaksinya (Swaminathan & Rogers, 1990). Efek kelompok menunjukkan DIF uniform; interaksi menunjukkan DIF non-uniform. Ukuran efek Nagelkerke delta R2 diklasifikasikan menurut Jodoin dan Gierl (2001)." },
  };

  // ------------------------------------------------------------------------------------
  // Tingkat keyakinan
  // ------------------------------------------------------------------------------------
  function confidence(level, reason) { return { level, reason }; }
  const CONF_LABEL = { tinggi: "keyakinan tinggi", sedang: "keyakinan sedang", rendah: "keyakinan rendah" };

  // ------------------------------------------------------------------------------------
  // Bagian: kualitas data dan respons
  // ------------------------------------------------------------------------------------
  function dataQuality(res, adv) {
    const ms = adv.ms, pq = adv.pq, tes = adv.opts.testType === "tes";
    const N = res.summary.n_persons;
    const paras = [], actions = [], tech = [];
    let status = ST.GREEN;
    const bits = [];
    if (ms && ms.missing > 0) {
      paras.push(`Sebanyak ${pct(ms.pctMissing, 1)} sel data kosong. Dari jumlah itu, ${pct(100 * ms.omitted / ms.missing)} tergolong omitted ` +
        `(dilewati di tengah rentang yang dikerjakan) dan ${pct(100 * ms.notReached / ms.missing)} tergolong not-reached (sesudah butir terakhir ` +
        `yang dijawab${adv.blocks.detected ? " di setiap blok" : ""}). Pembedaan ini penting karena butir yang tidak sempat dikerjakan tidak memberi ` +
        "informasi apa pun tentang kemampuan, sedangkan butir yang dilewati kemungkinan besar memang tidak diketahui jawabannya.");
      if (ms.speeded) {
        paras.push(`Pola kosong mengikuti posisi butir (korelasi posisi dengan % not-reached ${num(ms.trend)}): proporsi person yang ` +
          "mencapai butir terakhir menurun tajam, sehingga tes ini tampak speeded. " +
          (isF(pq.r_answered_measure) ? `Jumlah butir yang dijawab berkorelasi ${num(pq.r_answered_measure)} dengan measure dan ${num(pq.r_answered_pcorrect)} ` +
            "dengan proporsi benar di antara butir yang dijawab. " : "") +
          (Math.abs(pq.r_answered_measure) < 0.3 ? "Kecepatan kerja hampir tidak berkaitan dengan kemampuan, sehingga memperlakukan not-reached sebagai missing relatif aman untuk kalibrasi butir. "
            : "Kecepatan kerja berkaitan cukup kuat dengan kemampuan; data kosong tidak dapat dianggap acak terhadap kemampuan. ") +
          (pq.r_answered_pcorrect < -0.3 ? "Korelasi negatif dengan proporsi benar menandakan sebagian person mempercepat kerja dengan mengorbankan ketelitian, misalnya menebak menjelang batas waktu." : ""));
        bits.push("pola speeded");
        if (adv.treatment === "asis") {
          status = ST.YELLOW;
          actions.push({ stage: 1, text: "Pilih perlakuan data kosong secara eksplisit di langkah Model. Untuk tes speeded, prosedur Ludlow dan O'Leary (1999) " +
            "mengalibrasi butir dengan not-reached diabaikan lalu menskor person dengan semua kosong dihitung salah." });
        }
      }
      tech.push(T("Sel kosong (omitted / not-reached)", `${pct(ms.pctMissing, 1)} (${pct(ms.pctOmitted, 1)} / ${pct(ms.pctNotReached, 1)})`, ""));
      tech.push(T("Korelasi posisi butir dengan % not-reached", num(ms.trend), `pola speeded bila >= ${num(A.RULES.SPEED_TREND, 1)} dan not-reached >= ${pct(100 * A.RULES.SPEED_NR_SHARE)} dari sel kosong`));
    }
    const TREAT = { asis: "kosong = missing", lo1999: "Ludlow & O'Leary (1999): kalibrasi dengan not-reached diabaikan, penskoran dengan kosong = salah", allwrong: "semua kosong = salah" };
    tech.push(T("Perlakuan data kosong", TREAT[adv.treatment] || adv.treatment, ""));
    if (adv.scored) {
      paras.push(`Sesuai perlakuan Ludlow dan O'Leary, measure akhir person dihitung ulang dengan item dijangkarkan pada hasil kalibrasi dan semua ` +
        `butir kosong dihitung salah. Person reliability berdasarkan measure akhir ini ${num(adv.scored.separation.model_reliability)} (MODEL), ` +
        `dibandingkan ${num(res.summary.person.model_reliability)} pada measure kalibrasi. Kolom 'Measure (skor akhir)' di tabel Person memuat nilainya.`);
    }
    // kualitas respons person
    const under = pq.n_underfit, ne = pq.n_nonextreme, exp = pq.expected_false_positive;
    const share = 100 * under / Math.max(ne, 1);
    if (pq.method === "lz*") {
      paras.push(`Person fit dinilai dengan lz* (Snijders, 2001), yang mempunyai distribusi rujukan normal baku sehingga laju tanda palsu dapat dikendalikan. ` +
        `${under} dari ${ne} person non-extreme (${pct(share, 1)}) underfit (lz* < ${num(A.RULES.LZ_UNDERFIT, 3)}), padahal secara acak diharapkan sekitar ` +
        `${num(exp, 0)} person (5%). Sebagai pembanding, kriteria lama yang meminjam rentang MNSQ item menandai ${pct(pq.pct_classic, 1)} person; selisih ini ` +
        `menunjukkan bahwa sebagian besar tanda lama berasal dari fluktuasi MNSQ pada person, bukan pola yang benar-benar menyimpang. ` +
        `${pq.n_overfit} person overfit (lz* > ${num(A.RULES.LZ_OVERFIT, 3)}); pola yang terlalu rapi tidak merusak pengukuran dan tidak perlu ditindaklanjuti.` +
        (isF(pq.lz_sd) ? ` Simpangan baku lz* pada data ini ${num(pq.lz_sd)}` + (adv.sim && isF(adv.sim.lz_sd_mean) ? `, sedangkan pada data simulasi yang patuh model ${num(adv.sim.lz_sd_mean)}.` : ".") : ""));
    } else {
      paras.push(`Person fit dinilai dari Infit/Outfit MNSQ yang sekaligus bermakna secara statistik (ZSTD > 2). ${under} dari ${ne} person (${pct(share, 1)}) ` +
        `underfit menurut kriteria gabungan ini, dibandingkan ${pct(pq.pct_classic, 1)} menurut rentang MNSQ saja.`);
    }
    if (tes && pq.nOptions) {
      paras.push(`Dengan ${pq.nOptions} opsi jawaban, peluang benar karena menebak adalah ${pct(100 / pq.nOptions)}. ${pq.n_chance} person memperoleh skor yang tidak ` +
        "lebih tinggi secara bermakna daripada tebakan murni (uji binomial satu sisi, p > 0,05). Skor mereka tidak dapat dibedakan dari menebak, " +
        "walaupun sebagian mungkin memang berkemampuan sangat rendah.");
    }
    if (share > 2 * 5 || (tes && pq.n_chance > 0.1 * N)) { status = status === ST.GREEN ? ST.YELLOW : status; bits.push("responden menyimpang melebihi harapan"); }
    if (share > 20 || (tes && pq.n_chance > 0.2 * N)) { status = ST.RED; }
    if (adv.sens && adv.sens.length > 1) {
      const s0 = adv.sens[0], s1 = adv.sens[1];
      if (!s1.skipped && !s1.error) {
        paras.push(`Analisis sensitivitas: tanpa ${s1.excluded} person yang menyimpang, person reliability berubah dari ${num(s0.person_reliability)} menjadi ` +
          `${num(s1.person_reliability)}, first contrast eigenvalue dari ${num(s0.eigenvalue)} menjadi ${num(s1.eigenvalue)}, dan item measure bergeser ` +
          `rata-rata ${num(s1.mean_abs_shift)} logit (terbesar ${num(s1.max_abs_shift)} pada ${s1.max_shift_item}; korelasi ${num(s1.r_measures, 3)}).` +
          (s1.eigenvalue < s0.eigenvalue - 0.5 ? " Turunnya eigenvalue berarti sebagian 'dimensi kedua' berasal dari responden yang menyimpang, bukan dari isi butir." : "") +
          (s1.person_reliability < s0.person_reliability - 0.03 ? " Reliabilitas justru turun karena responden menyimpang ikut memperlebar sebaran measure; reliabilitas yang dilaporkan sebagian ditopang oleh mereka." : ""));
      }
      tech.push(T("Sensitivitas: reliabilitas person (semua / tanpa menyimpang)", `${num(s0.person_reliability)} / ${num(s1.person_reliability)}`, ""));
    }
    if (under > 0) actions.push({ stage: 2, text: `Periksa lembar jawaban ${under} person underfit${tes && pq.n_chance ? ` dan ${pq.n_chance} person dengan skor setara tebakan` : ""} ` +
      "(tabel Person, kolom Kualitas). Keluarkan hanya bila ada alasan substantif (menjawab asal, identitas ganda, kendala teknis); bandingkan hasilnya dengan tabel sensitivitas." });
    tech.push(T(pq.method === "lz*" ? "Person underfit (lz* < -1,645)" : "Person underfit (MNSQ dan ZSTD)", `${under} (${pct(share, 1)})`, pq.method === "lz*" ? `harapan acak ${num(exp, 0)} (5%)` : ""));
    tech.push(T("Person misfit menurut rentang MNSQ (kriteria lama)", `${pq.n_classic} (${pct(pq.pct_classic, 1)})`, "tidak lagi dipakai untuk vonis"));
    if (tes && pq.nOptions) tech.push(T("Skor setara tebakan", String(pq.n_chance), `binomial, peluang 1/${pq.nOptions}`));
    // kunci jawaban
    if (adv.distractors) {
