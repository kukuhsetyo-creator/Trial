<style id="app-css">/* RaschLite versi HTML: gaya deck CSPS (warna dari raschlite/theme.py). */
:root {
  --bg: #F7F3EE; --card: #FFFDF9; --sand: #EEE6DC; --line: #E3D8CB; --line2: #D9CBBB;
  --ink: #2A2522; --ink2: #4E443D; --muted: #6B5E54; --bronze: #7A5638; --navy: #1F2F45;
  --navytext: #F4EFE8; --sandnavy: #E9D3B8; --flag: #F4DED5; --dim: #EEE6DC; --terra: #D8A696;
  --hijau: #5E8C7A; --kuning: #C99A3B; --merah: #A8401F; --abu: #B5A99C;
  --info-bg: #EEF4F8; --info-line: #A7DAF2; --warn-bg: #FBF1DE; --warn-line: #E2C27A;
  --err-bg: #F4DED5; --err-line: #D8A696;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.55 "Segoe UI", "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
.serif { font-family: Georgia, "DejaVu Serif", serif; }
header.band { background: var(--navy); color: var(--navytext); padding: 14px 24px; display: flex; align-items: center; gap: 18px; }
header.band img { height: 42px; }
header.band .kicker { color: var(--sandnavy); letter-spacing: 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
header.band h1 { font: 400 24px/1.1 Georgia, "DejaVu Serif", serif; margin: 2px 0 0; letter-spacing: 1px; }
header.band .spacer { flex: 1; }
header.band .ver { color: #D8CCBC; font-size: 12px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px 20px 48px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.steps div { background: var(--sand); color: var(--ink2); border-radius: 8px; padding: 8px 10px; text-align: center; font-size: 13px; }
.steps div.done { background: #E3D8CB; }
.steps div.active { background: var(--navy); color: var(--navytext); font-weight: 600; }
.page { display: none; }
.page.active { display: block; }
h2.title { font: 400 24px/1.2 Georgia, "DejaVu Serif", serif; text-transform: uppercase; letter-spacing: 2px; margin: 6px 0 10px; }
h3 { font-size: 16px; margin: 20px 0 6px; }
p.help { color: var(--ink2); margin: 0 0 12px; max-width: 900px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 10px 0; }
.card > .label { color: var(--bronze); font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; display: block; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(260px, 1.4fr); gap: 14px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .steps { grid-template-columns: repeat(2, 1fr); } }
button, .btn { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button:hover { background: var(--sand); }
button:disabled { color: var(--abu); border-color: var(--line); background: var(--bg); cursor: default; }
button.primary { background: var(--navy); color: var(--navytext); border-color: var(--navy); font-weight: 600; }
button.primary:hover { background: #2C4160; }
button.primary:disabled { background: #9AA3AF; border-color: #9AA3AF; }
select, input[type=text] { font: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; color: var(--ink); max-width: 100%; }
label.field { display: block; margin: 8px 0 3px; color: var(--ink2); font-weight: 600; font-size: 13px; }
.checklist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--card); columns: 3 120px; }
.checklist label { display: block; break-inside: avoid; white-space: nowrap; }
.nav { display: flex; justify-content: space-between; margin-top: 16px; }
.banner { border-radius: 10px; padding: 10px 14px; margin: 10px 0; border: 1px solid; }
.banner.info { background: var(--info-bg); border-color: var(--info-line); }
.banner.warning { background: var(--warn-bg); border-color: var(--warn-line); }
.banner.error { background: var(--err-bg); border-color: var(--err-line); }
.banner:empty { display: none; }
.models label { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--card); }
.models label.disabled { color: var(--abu); }
.models small { display: block; color: var(--muted); margin-left: 24px; }
progress { width: 100%; height: 18px; accent-color: #34589A; }
pre.log { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 260px; overflow: auto; font-size: 12px; }
.result-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
.result-head .meta { color: var(--bronze); font-weight: 600; letter-spacing: 1px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: 8px 8px 0 0; border-bottom: none; background: var(--sand); color: var(--ink2); padding: 6px 12px; }
.tabs button.active { background: var(--card); color: var(--ink); border-top: 3px solid var(--bronze); font-weight: 600; }
.tabpanel { display: none; background: var(--card); border: 1px solid var(--line); border-top: none; padding: 14px 16px; border-radius: 0 0 10px 10px; }
.tabpanel.active { display: block; }
.lights { display: grid; gap: 8px; }
.light { display: grid; grid-template-columns: 220px 1fr; gap: 12px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
@media (max-width: 700px) { .light { grid-template-columns: 1fr; } }
.light .status { color: var(--muted); font-size: 12px; margin-left: 22px; }
.dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--muted); vertical-align: -1px; margin-right: 7px; }
.s-tentatif { background: repeating-linear-gradient(45deg, var(--kuning) 0 3px, var(--card) 3px 6px); border-color: var(--kuning); }
.s-hijau { background: var(--hijau); } .s-kuning { background: var(--kuning); } .s-merah { background: var(--merah); } .s-abu { background: var(--abu); }
details { margin: 4px 0 12px; } summary { cursor: pointer; color: var(--bronze); font-weight: 600; }
.tablewrap { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
table.data { border-collapse: collapse; font-size: 13px; width: 100%; background: var(--card); }
table.data th, table.data td { border: 1px solid var(--line); padding: 3px 8px; vertical-align: top; }
table.data th { background: var(--sand); text-align: left; position: sticky; top: 0; cursor: pointer; white-space: nowrap; z-index: 1; }
table.data th.sorted-asc::after { content: " ▲"; font-size: 10px; } table.data th.sorted-desc::after { content: " ▼"; font-size: 10px; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.flag td { background: var(--flag); } table.data tr.dim td { background: var(--dim); }
table.tech { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
table.tech th, table.tech td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
table.tech th { background: var(--sand); }
.refs { color: var(--ink2); font-size: 12.5px; }
.chartbox { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .chartbox { grid-template-columns: 1fr; } }
.chart svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; }
.howto { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--bronze); border-radius: 8px; padding: 10px 12px; color: var(--ink2); }
.howto b { color: var(--bronze); display: block; margin-bottom: 4px; }
.glossary dt { font-weight: 600; margin-top: 10px; } .glossary dd { margin: 2px 0 0; color: var(--ink2); }
footer { color: var(--bronze); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; text-align: center; padding: 18px; }
.preview { max-height: 300px; }
.busy { opacity: .6; pointer-events: none; }
#printframe { position: absolute; width: 0; height: 0; border: 0; }

.synth { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.synth p { margin: 6px 0; }
.conf { display: inline-block; font-size: 11px; color: var(--bronze); border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; margin-left: 6px; white-space: nowrap; }
ol.stages { padding-left: 20px; } ol.stages li { margin: 5px 0; } ol.stages .stage { color: var(--bronze); font-weight: 600; }
.mini { font-size: 12.5px; color: var(--muted); }
table.data td.st-serius { background: var(--err-bg); } table.data td.st-telaah { background: var(--warn-bg); }
</style>
</head>
<body>
<header class="band">
  <img id="logo" alt="Logo CSPS">
  <div><div class="kicker">Center for Social Psychology and Society</div><h1 id="app-name">RaschLite by CSPS</h1></div>
  <div class="spacer"></div><div class="ver" id="app-ver"></div>
</header>
<main>
  <div id="steps" class="steps"></div>

  <section id="page-import" class="page">
    <h2 class="title" id="t-import"></h2>
    <p class="help" id="import-help"></p>
    <div class="row">
      <button id="btn-open" class="primary"></button><button id="btn-dicho"></button><button id="btn-poly"></button>
      <input type="file" id="file" accept=".csv,.txt,.xlsx,.xlsm" hidden>
    </div>
    <p id="file-label" class="help"></p>
    <div id="import-form" hidden>
      <div class="grid2">
        <div class="card">
          <label class="field" id="l-id" for="id-col"></label><select id="id-col"></select>
          <label class="field" id="l-group" for="group-col"></label><select id="group-col"></select>
          <label class="field" id="l-missing" for="missing"></label><input type="text" id="missing">
        </div>
        <div class="card">
          <span class="label" id="l-items"></span>
          <div class="row" style="margin-bottom:6px"><button id="btn-all"></button><button id="btn-clear"></button></div>
          <div id="items" class="checklist"></div>
        </div>
      </div>
      <div id="preview"></div>
    </div>
    <div id="import-banner" class="banner"></div>
    <div class="nav"><span></span><button id="btn-next1" class="primary"></button></div>
  </section>

  <section id="page-model" class="page">
    <h2 class="title" id="t-model"></h2>
    <p id="detected" class="help"></p>
    <div class="card"><span class="label" id="l-recommend"></span><div id="recommend"></div></div>
    <div id="models" class="models"></div>
    <div class="card">
      <label><input type="checkbox" id="strict"> <span id="strict-label"></span></label><br>
      <label><input type="checkbox" id="dif"> <span id="dif-label"></span></label>
    </div>
    <div class="card" id="adv-card">
      <span class="label">Diagnostik lanjutan</span>
      <div class="grid2">
        <div>
          <label class="field">Jenis instrumen</label>
          <label><input type="radio" name="testtype" value="tes"> Tes kemampuan (jawaban benar/salah)</label><br>
          <label><input type="radio" name="testtype" value="angket"> Angket atau skala sikap</label>
          <label class="field" for="n-options">Jumlah opsi jawaban per butir (pilihan ganda; kosongkan bila tidak relevan)</label>
          <input type="text" id="n-options" inputmode="numeric" placeholder="mis. 4">
          <label class="field" for="sim-reps">Simulasi data patuh model (ambang eigenvalue/Q3, pemulihan parameter)</label>
          <select id="sim-reps"><option value="0">Tidak dijalankan (ambang tetap)</option><option value="30">30 replikasi</option><option value="50">50 replikasi</option><option value="100">100 replikasi</option></select>
          <label class="field">Analisis tambahan</label>
          <label><input type="checkbox" id="opt-sens" checked> Analisis sensitivitas tanpa responden menyimpang</label><br>
          <label><input type="checkbox" id="opt-tailored" checked> Tailored analysis untuk tebakan (tes dikotomus)</label><br>
          <label><input type="checkbox" id="opt-cmle"> CMLE sebagai estimator pembanding</label>
        </div>
        <div>
          <label class="field">Data kosong</label>
          <div id="missing-summary" class="help"></div>
          <div id="treatments" class="models"></div>
        </div>
      </div>
    </div>
    <div id="category-banner" class="banner"></div>
    <div id="notes-banner" class="banner"></div>
    <div class="nav"><button id="btn-back2" class="btn-back"></button><button id="btn-run" class="primary"></button></div>
  </section>

  <section id="page-run" class="page">
    <h2 class="title" id="t-run"></h2>
    <p class="help" id="run-help"></p>
    <progress id="run-progress" max="1" value="0"></progress>
    <pre id="run-log" class="log"></pre>
    <div id="run-banner" class="banner"></div>
    <div class="nav"><button id="btn-run-back" class="btn-back"></button><button id="btn-cancel"></button></div>
  </section>

  <section id="page-results" class="page">
    <div class="result-head">
      <div class="meta" id="result-meta"></div>
      <div class="row" id="export-buttons">
        <button id="btn-excel" class="primary"></button><button id="btn-html"></button>
        <button id="btn-pdf"></button><button id="btn-charts"></button><button id="btn-audit"></button>
      </div>
    </div>
    <div id="export-banner" class="banner"></div>
    <div id="tabs" class="tabs"></div>
    <div id="panels"></div>
    <div class="nav"><button id="btn-back4" class="btn-back"></button><button id="btn-new" class="primary"></button></div>
  </section>
</main>
<footer>RaschLite by CSPS · Center for Social Psychology and Society</footer>

IF)", "loadings": "PCA of Residuals: First Contrast Loadings", "q3_pairs": "Local Dependence: Item Pairs with High Q3"}, "NOTE_LEVELS": {"error": "Galat", "warning": "Peringatan", "info": "Info"}, "ITER_HEAD": ["Iterasi", "Max logit change", "Max score residual"], "LIGHTS_HEAD": ["Aspek", "Status", "Ringkasan"], "REPORT_TABLE_HINT": "Baris berwarna menandakan nilai yang perlu diperiksa; baris abu-abu menandakan extreme score.", "REPORT_TECHNICAL": "Detail teknis"}, "common": {"APP_NAME": "RaschLite by CSPS", "TABLE_COLUMNS": {"items": ["item", "status", "n_categories", "score", "count", "measure", "se", "infit_mnsq", "infit_zstd", "outfit_mnsq", "outfit_zstd", "ptmea_obs", "ptmea_exp", "flag_misfit", "flag_negative_ptmea"], "persons": ["person", "group", "status", "score", "max_score", "count", "measure", "se", "infit_mnsq", "infit_zstd", "outfit_mnsq", "outfit_zstd", "flag_misfit"], "categories": ["item", "label", "count", "percent", "avg_measure", "outfit_mnsq", "outfit_expected", "outfit_z", "threshold", "threshold_se", "threshold_location", "flag_low_count", "flag_disordered_threshold", "flag_disordered_avg", "flag_outfit_high"], "dif": ["item", "measure_a", "se_a", "n_a", "measure_b", "se_b", "n_b", "contrast", "joint_se", "t", "df", "p", "ets_category", "flag_dif"], "loadings": ["item", "measure", "loading"], "q3_pairs": ["item_a", "item_b", "q3", "q3_relative"]}, "CATEGORY_FLAGS": ["flag_low_count", "flag_disordered_threshold", "flag_disordered_avg", "flag_outfit_high"], "DECIMALS": {"score": 0, "max_score": 0, "count": 0, "n_a": 0, "n_b": 0, "df": 0, "percent": 1, "p": 4, "q3": 3, "q3_relative": 3}}, "theme": {"BACKGROUND": "#F7F3EE", "CARD": "#FFFDF9", "SAND": "#EEE6DC", "LINE": "#E3D8CB", "LINE_STRONG": "#D9CBBB", "INK": "#2A2522", "INK_SECONDARY": "#4E443D", "INK_MUTED": "#6B5E54", "BRONZE": "#7A5638", "BRONZE_LIGHT": "#A27A5C", "NAVY": "#1F2F45", "NAVY_TEXT": "#F4EFE8", "SAND_ON_NAVY": "#E9D3B8", "TERRA_HEAD": "#D8A696", "FLAG_ROW": "#F4DED5", "MUTED_ROW": "#EEE6DC", "STATUS": {"hijau": "#5E8C7A", "kuning": "#C99A3B", "merah": "#A8401F", "abu": "#B5A99C"}, "STATUS_TINT": {"hijau": "#DCE8E2", "kuning": "#F6EAD0", "merah": "#F4DED5", "abu": "#EEE6DC"}, "BANNER": {"info": ["#EEF4F8", "#A7DAF2"], "warning": ["#FBF1DE", "#E2C27A"], "error": ["#F4DED5", "#D8A696"]}, "CHART_BG": "#FFFFFF", "CHART_GRID": "#EAE2D8", "CHART_AXIS": "#D9CBBB", "NAVY_SERIES": "#34589A", "OCHRE": "#D08A2E", "SKY": "#2A9AD6", "PLUM": "#9C4A85", "SAGE": "#3C9A7C", "SERIES": ["#34589A", "#D08A2E", "#2A9AD6", "#9C4A85", "#3C9A7C"], "PROBLEM": "#A8401F", "GOOD_ZONE": "#5E8C7A", "NEUTRAL": "#BFB2A4", "DIVERGING": ["#34589A", "#F3EEE7", "#A8401F"]}, "modelNames": {"dichotomous": "Dichotomous Rasch Model", "rsm": "Rating Scale Model (Andrich)", "pcm": "Partial Credit Model (Masters)"}, "lightStatus": {"hijau": "Hijau", "kuning": "Kuning", "merah": "Merah", "abu": "Abu-abu"}, "maxListed": 6, "glossary": {"item": {"term": "Item", "short": "Satu soal atau pernyataan dalam tes atau angket (sering disebut butir).", "long": "Item adalah satu soal, pertanyaan, atau pernyataan yang dijawab person. Dalam analisis Rasch setiap item memperoleh item measure, yaitu posisi tingkat kesulitannya (atau seberapa berat pernyataan itu untuk disetujui) pada skala logit."}, "person": {"term": "Person", "short": "Satu responden atau peserta tes yang jawabannya dianalisis.", "long": "Person adalah sebutan baku dalam pemodelan Rasch untuk setiap responden, peserta tes, atau subjek yang memberikan jawaban. Setiap person memperoleh person measure, yaitu perkiraan kemampuan atau tingkat sifat yang diukur, pada skala logit yang sama dengan item."}, "raw_score": {"term": "Raw Score", "short": "Jumlah skor jawaban sebelum diubah menjadi measure dalam logit.", "long": "Raw score adalah jumlah skor jawaban seorang person (atau jumlah skor yang diperoleh sebuah item dari semua person). Model Rasch mengubah raw score menjadi measure pada skala logit sehingga selisih antar-measure bermakna sama di seluruh rentang skala, sesuatu yang tidak dimiliki raw score."}, "logit": {"term": "Logit", "short": "Satuan 'penggaris bersama' untuk kemampuan person dan kesulitan item.", "long": "Logit (log-odds unit) adalah satuan ukur pada analisis Rasch. Kemampuan person dan kesulitan item diletakkan pada penggaris yang sama, sehingga keduanya dapat dibandingkan langsung. Bila kemampuan seseorang sama dengan kesulitan item, peluangnya menjawab benar 50%; setiap selisih satu logit mengubah peluang itu dengan cara yang sama di mana pun posisinya pada penggaris."}, "measure": {"term": "Measure", "short": "Posisi person atau item pada penggaris logit.", "long": "Person measure adalah perkiraan kemampuan (atau tingkat sifat yang diukur) seorang person; item measure adalah perkiraan kesulitan item. Rata-rata item measure ditetapkan 0 logit sebagai titik acuan skala."}, "se": {"term": "Standard Error (SE)", "short": "Seberapa presisi sebuah measure; makin kecil makin presisi.", "long": "Standard error (Model SE) menunjukkan ketidakpastian perkiraan measure. Secara kasar, measure yang sebenarnya kemungkinan besar berada dalam rentang measure plus-minus dua kali SE. SE mengecil bila jumlah item (untuk person) atau jumlah person (untuk item) bertambah."}, "extreme": {"term": "Extreme Score", "short": "Skor nol atau sempurna; measure-nya diperkirakan dengan penyesuaian 0,3 poin.", "long": "Person yang menjawab semua item benar (atau semua salah) memiliki extreme score: tes tidak memberi informasi tentang batas kemampuannya, sehingga ia tidak ikut estimasi parameter. Measure-nya diperkirakan seolah-olah skornya kurang (atau lebih) 0,3 poin dari batas. Hal yang sama berlaku untuk item yang dijawab benar atau salah oleh semua person."}, "mnsq": {"term": "Mean-Square (MNSQ)", "short": "Rasio 'kejutan' teramati terhadap yang wajar menurut model; nilai ideal 1,0.", "long": "MNSQ membandingkan seberapa besar jawaban menyimpang dari harapan model dengan penyimpangan yang wajar terjadi secara acak. Nilai 1 berarti sesuai harapan, di atas 1 berarti lebih banyak kejutan (noise), dan di bawah 1 berarti pola terlalu mudah ditebak. Rentang 0,5 sampai 1,5 dianggap produktif untuk pengukuran (Linacre, 2002)."}, "infit": {"term": "Infit MNSQ", "short": "Statistik fit yang peka terhadap jawaban tak terduga dari person yang kemampuannya dekat dengan kesulitan item.", "long": "Infit adalah mean-square berbobot informasi (information-weighted). Statistik ini paling peka terhadap pola jawaban yang aneh dari person yang setara dengan item, misalnya item yang membingungkan bagi person dengan kemampuan sedang."}, "outfit": {"term": "Outfit MNSQ", "short": "Statistik fit yang peka terhadap jawaban sangat tak terduga, seperti salah ceroboh atau tebakan beruntung.", "long": "Outfit (outlier-sensitive fit) adalah rata-rata kuadrat standardized residual tanpa pembobotan. Statistik ini mudah naik oleh beberapa jawaban yang sangat mengejutkan, misalnya person pandai yang salah pada soal sangat mudah, atau person lemah yang benar pada soal sangat sulit."}, "zstd": {"term": "ZSTD", "short": "Uji signifikansi MNSQ dalam bentuk skor-z; peka terhadap ukuran sampel.", "long": "ZSTD (standardized fit) mengubah MNSQ menjadi statistik yang kira-kira berdistribusi normal baku (transformasi Wilson-Hilferty). Pada sampel besar, penyimpangan kecil yang tidak berarti secara praktis pun dapat memberi ZSTD besar, sehingga MNSQ lebih diutamakan untuk menilai besarnya masalah."}, "misfit": {"term": "Misfit (Underfit / Overfit)", "short": "Item atau person yang MNSQ-nya berada di luar rentang yang dipakai.", "long": "Underfit (MNSQ terlalu tinggi) berarti pola jawaban lebih acak atau lebih mengejutkan daripada harapan model; kondisi ini yang paling mengganggu pengukuran. Overfit (MNSQ terlalu rendah) berarti pola jawaban terlalu mudah ditebak, misalnya karena item yang isinya hampir sama; umumnya tidak merusak measure tetapi dapat membuat reliability tampak terlalu tinggi."}, "ptmeasure": {"term": "Point-Measure Correlation (PTMEA Corr.)", "short": "Korelasi antara skor sebuah item dan person measure; seharusnya positif.", "long": "Korelasi ini menunjukkan apakah person yang lebih mampu cenderung mendapat skor lebih tinggi pada item tersebut. Nilai negatif mengindikasikan kemungkinan kunci jawaban salah atau item berkalimat negatif (reverse-coded) yang skornya belum dibalik. Kolom 'exp.' memberi nilai yang diharapkan model sebagai pembanding bagi nilai teramati ('obs.')."}, "reliability": {"term": "Reliability", "short": "Seberapa konsisten urutan person (atau item) bila pengukuran diulang.", "long": "Rasch reliability adalah proporsi varians measure yang bukan galat ukur. Person reliability 0,80 berarti 80% perbedaan measure antar-person mencerminkan perbedaan yang sebenarnya. Nilainya sebanding dengan koefisien reliability klasik seperti Cronbach's alpha, tetapi dihitung dari measure. Angka REAL memperhitungkan misfit sehingga lebih konservatif daripada angka MODEL."}, "separation": {"term": "Separation", "short": "Berapa kali sebaran 'sebenarnya' lebih besar daripada galat pengukuran.", "long": "Separation membandingkan sebaran measure yang sebenarnya dengan rata-rata galat ukur (RMSE). Person separation 2 berarti tes mampu memisahkan person ke dalam beberapa tingkat kemampuan yang berbeda secara bermakna; item separation 3 berarti urutan kesulitan item cukup mantap."}, "strata": {"term": "Strata", "short": "Perkiraan jumlah kelompok kemampuan yang dapat dibedakan secara statistik.", "long": "Strata dihitung sebagai (4 x separation + 1) / 3 (Wright & Masters, 2002). Strata 3 berarti tes kira-kira dapat membedakan kelompok rendah, sedang, dan tinggi."}, "targeting": {"term": "Targeting", "short": "Kesesuaian tingkat kesulitan item dengan kemampuan person.", "long": "Targeting dinilai dari selisih rata-rata person measure dengan rata-rata item measure (yang ditetapkan 0 logit). Tes yang well-targeted berisi item yang tersebar di sekitar kemampuan sebagian besar person, sehingga setiap item memberi informasi dan measure diperoleh dengan presisi tertinggi."}, "threshold": {"term": "Andrich Threshold", "short": "Titik pada penggaris tempat dua kategori jawaban yang berdampingan sama mungkinnya.", "long": "Pada skala bertingkat, Andrich threshold adalah titik tempat peluang memilih kategori k sama dengan peluang memilih kategori k-1. Threshold seharusnya naik berurutan seperti anak tangga. Threshold location adalah posisi threshold itu pada skala logit, yaitu item measure ditambah Andrich threshold."}, "disordered_threshold": {"term": "Disordered Threshold", "short": "Threshold yang lebih rendah daripada threshold sebelumnya.", "long": "Disordered threshold berarti ada kategori jawaban yang tidak pernah menjadi pilihan paling mungkin bagi person pada tingkat kemampuan mana pun. Kondisi ini mengindikasikan bahwa person sulit membedakan kategori tersebut dari kategori di sebelahnya; solusi yang umum ditelaah adalah menggabungkan kategori atau memperjelas labelnya."}, "observed_average": {"term": "Observed Average", "short": "Rata-rata measure person yang memilih sebuah kategori; seharusnya naik berurutan.", "long": "Observed average adalah rata-rata (person measure dikurangi item measure) dari semua person yang memilih kategori tersebut. Pada skala yang berfungsi baik, kategori yang lebih tinggi dipilih oleh person yang rata-ratanya lebih tinggi; bila tidak naik (disordered average), urutan kategori kemungkinan tidak dipahami sesuai maksudnya."}, "category_outfit": {"term": "Category Outfit", "short": "Outfit MNSQ untuk penggunaan sebuah kategori jawaban.", "long": "Category outfit menunjukkan seberapa tidak terduga sebuah kategori dipakai. Linacre (2002) memakai pedoman outfit kategori di bawah 2,0. Karena nilai harapan category outfit tidak selalu 1, RaschLite juga menampilkan expected outfit dan menandai kategori hanya bila outfit-nya tinggi sekaligus melampaui harapan model secara bermakna."}, "unidimensionality": {"term": "Unidimensionality", "short": "Semua item mengukur satu kemampuan atau sifat utama yang sama.", "long": "Model Rasch mengasumsikan semua item mengukur satu dimensi. Asumsi ini diperiksa dengan PCA of residuals: setelah pengaruh measure dikeluarkan, sisa jawaban seharusnya acak. First contrast eigenvalue di bawah 2 mendukung asumsi tersebut."}, "first_contrast": {"term": "First Contrast (PCA of Residuals)", "short": "Pola terkuat yang tersisa setelah measure dikeluarkan; kekuatannya dalam satuan item.", "long": "First contrast adalah komponen pertama dari principal component analysis (PCA) atas standardized residual. Eigenvalue-nya dinyatakan dalam satuan 'setara sekian item'; loading menunjukkan seberapa kuat setiap item terkait dengan pola itu. Item dengan loading positif dan negatif yang besar membentuk dua kutub yang isinya perlu dibandingkan."}, "q3": {"term": "Yen's Q3 (Local Dependence)", "short": "Korelasi residual antar-pasangan item untuk mendeteksi item yang saling bergantung.", "long": "Q3 yang jauh di atas rata-rata Q3 menandakan local dependence: dua item 'saling terkait' di luar kemampuan yang diukur, misalnya soal bertingkat dari satu wacana atau dua item dengan redaksi hampir sama. RaschLite memakai batas relatif, yaitu rata-rata Q3 + 0,2 (Christensen dkk., 2017)."}, "dif": {"term": "Differential Item Functioning (DIF)", "short": "Item berperilaku berbeda bagi kelompok yang kemampuannya setara.", "long": "DIF terjadi bila dua kelompok (misalnya laki-laki dan perempuan) dengan kemampuan sama memiliki peluang berbeda untuk menjawab benar sebuah item. DIF contrast adalah selisih item measure antar-kelompok. DIF adalah tanda untuk menelaah isi item, bukan bukti otomatis bahwa item itu bias."}, "ets": {"term": "ETS DIF Category (A / B / C)", "short": "Penggolongan besar DIF: A dapat diabaikan, B sedang, C besar.", "long": "Penggolongan ini mengikuti Zwick, Thayer, dan Lewis (1999) dalam satuan logit: C bila DIF contrast mutlak sedikitnya 0,64 logit dan secara bermakna melampaui 0,43 logit; B bila DIF sedikitnya 0,43 logit dan bermakna berbeda dari nol; selain itu A."}}, "charts": [{"key": "wright_map", "title": "Wright Map", "perItem": false, "howToRead": {"dichotomous": "Bagian kiri menunjukkan sebaran person measure dan bagian kanan posisi item measure, keduanya pada penggaris logit yang sama. Makin ke atas, makin tinggi kemampuan person dan makin sulit item-nya. Tes yang well-targeted memperlihatkan item yang tersebar setinggi kebanyakan person; wilayah tanpa item berarti kemampuan di wilayah itu kurang terukur.", "polytomous": "Bagian kiri menunjukkan sebaran person measure dan bagian kanan posisi item measure, keduanya pada penggaris logit yang sama. Makin ke atas, makin tinggi kemampuan person dan makin sulit item-nya. Tes yang well-targeted memperlihatkan item yang tersebar setinggi kebanyakan person; wilayah tanpa item berarti kemampuan di wilayah itu kurang terukur. Titik berwarna adalah threshold location tiap item, yaitu titik peralihan dari satu kategori jawaban ke kategori berikutnya."}}, {"key": "icc", "title": "Item Characteristic Curve (ICC)", "perItem": true, "howToRead": {"dichotomous": "Garis biru adalah model curve, yaitu peluang menjawab benar (atau expected score) yang diperkirakan model pada setiap tingkat person measure. Titik oranye adalah observed average kelompok person yang kemampuannya mirip, dengan garis tegak sebagai rentang ketidakpastian 95%. Bila titik-titik mengikuti garis, item berperilaku sesuai model; titik yang jauh dari garis menandakan item yang perlu diperiksa.", "polytomous": "Garis biru adalah model curve, yaitu peluang menjawab benar (atau expected score) yang diperkirakan model pada setiap tingkat person measure. Titik oranye adalah observed average kelompok person yang kemampuannya mirip, dengan garis tegak sebagai rentang ketidakpastian 95%. Bila titik-titik mengikuti garis, item berperilaku sesuai model; titik yang jauh dari garis menandakan item yang perlu diperiksa."}}, {"key": "category_curves", "title": "Category Probability Curves", "perItem": true, "howToRead": {"dichotomous": "Setiap kurva menunjukkan peluang memilih satu kategori jawaban pada berbagai tingkat person measure. Garis tegak adalah threshold, titik tempat dua kategori bersebelahan sama mungkinnya. Pada skala yang berfungsi baik, setiap kategori punya puncak sendiri dan threshold berurutan dari kiri ke kanan; garis merah menandai disordered threshold.", "polytomous": "Setiap kurva menunjukkan peluang memilih satu kategori jawaban pada berbagai tingkat person measure. Garis tegak adalah threshold, titik tempat dua kategori bersebelahan sama mungkinnya. Pada skala yang berfungsi baik, setiap kategori punya puncak sendiri dan threshold berurutan dari kiri ke kanan; garis merah menandai disordered threshold."}}, {"key": "expected_score", "title": "Expected Score Curve", "perItem": true, "howToRead": {"dichotomous": "Kurva menunjukkan expected score pada item ini untuk setiap tingkat person measure. Pita berselang-seling menandai rentang measure tempat expected score paling dekat dengan suatu kategori. Pita yang sangat sempit berarti kategori itu jarang menjadi skor yang diharapkan bagi tingkat kemampuan mana pun.", "polytomous": "Kurva menunjukkan expected score pada item ini untuk setiap tingkat person measure. Pita berselang-seling menandai rentang measure tempat expected score paling dekat dengan suatu kategori. Pita yang sangat sempit berarti kategori itu jarang menjadi skor yang diharapkan bagi tingkat kemampuan mana pun."}}, {"key": "test_information", "title": "Test Information Function and SEM", "perItem": false, "howToRead": {"dichotomous": "Garis biru (sumbu kiri) adalah test information, yaitu seberapa banyak informasi yang diberikan tes pada setiap tingkat person measure; makin tinggi, makin presisi. Garis oranye (sumbu kanan) adalah standard error of measurement (SEM), kebalikannya: makin rendah, makin presisi. Tes paling tepat untuk person yang kemampuannya berada di sekitar puncak garis biru.", "polytomous": "Garis biru (sumbu kiri) adalah test information, yaitu seberapa banyak informasi yang diberikan tes pada setiap tingkat person measure; makin tinggi, makin presisi. Garis oranye (sumbu kanan) adalah standard error of measurement (SEM), kebalikannya: makin rendah, makin presisi. Tes paling tepat untuk person yang kemampuannya berada di sekitar puncak garis biru."}}, {"key": "fit_bubble", "title": "Item Fit Bubble Chart", "perItem": false, "howToRead": {"dichotomous": "Setiap gelembung adalah satu item: posisi mendatar menunjukkan item measure dan posisi tegak menunjukkan Infit atau Outfit MNSQ. Item di dalam pita hijau berperilaku sesuai harapan; item merah di atas pita underfit (terlalu 'berisik'), di bawah pita overfit (terlalu mudah ditebak). Gelembung besar berarti SE item itu besar sehingga estimasinya kurang presisi.", "polytomous": "Setiap gelembung adalah satu item: posisi mendatar menunjukkan item measure dan posisi tegak menunjukkan Infit atau Outfit MNSQ. Item di dalam pita hijau berperilaku sesuai harapan; item merah di atas pita underfit (terlalu 'berisik'), di bawah pita overfit (terlalu mudah ditebak). Gelembung besar berarti SE item itu besar sehingga estimasinya kurang presisi."}}, {"key": "person_fit", "title": "Person Fit Distribution", "perItem": false, "howToRead": {"dichotomous": "Histogram menunjukkan sebaran Infit dan Outfit MNSQ person. Sebagian besar person seharusnya berada di pita hijau di sekitar 1,0. Ekor panjang ke kanan menandakan person dengan pola jawaban tak terduga (underfit), misalnya menebak atau menjawab asal.", "polytomous": "Histogram menunjukkan sebaran Infit dan Outfit MNSQ person. Sebagian besar person seharusnya berada di pita hijau di sekitar 1,0. Ekor panjang ke kanan menandakan person dengan pola jawaban tak terduga (underfit), misalnya menebak atau menjawab asal."}}, {"key": "pca_contrast", "title": "PCA of Residuals: First Contrast", "perItem": false, "howToRead": {"dichotomous": "Setiap titik adalah satu item; posisi tegaknya adalah loading pada first contrast, yaitu keterkaitan item dengan pola sisa terkuat setelah measure dikeluarkan. Bila item bertitik biru (loading positif) dan oranye (loading negatif) membentuk dua kelompok isi yang berbeda, tes mungkin mengukur dua hal. First contrast eigenvalue di bawah 2 menandakan pola sisa tersebut masih wajar terjadi secara kebetulan.", "polytomous": "Setiap titik adalah satu item; posisi tegaknya adalah loading pada first contrast, yaitu keterkaitan item dengan pola sisa terkuat setelah measure dikeluarkan. Bila item bertitik biru (loading positif) dan oranye (loading negatif) membentuk dua kelompok isi yang berbeda, tes mungkin mengukur dua hal. First contrast eigenvalue di bawah 2 menandakan pola sisa tersebut masih wajar terjadi secara kebetulan."}}, {"key": "dif", "title": "DIF Plot: Item Measure by Group", "perItem": false, "howToRead": {"dichotomous": "Untuk setiap item, titik biru dan oranye menunjukkan item measure bagi masing-masing kelompok, dengan garis tegak sebagai rentang ketidakpastian 95%. Bila kedua titik berdekatan, item berfungsi sama bagi kedua kelompok. Pita merah menandai item yang DIF contrast-nya cukup besar dan bermakna secara statistik sehingga isinya perlu ditelaah.", "polytomous": "Untuk setiap item, titik biru dan oranye menunjukkan item measure bagi masing-masing kelompok, dengan garis tegak sebagai rentang ketidakpastian 95%. Bila kedua titik berdekatan, item berfungsi sama bagi kedua kelompok. Pita merah menandai item yang DIF contrast-nya cukup besar dan bermakna secara statistik sehingga isinya perlu ditelaah."}}, {"key": "q3_heatmap", "title": "Yen's Q3 Matrix", "perItem": false, "howToRead": {"dichotomous": "Setiap kotak adalah Q3, yaitu korelasi residual antara dua item. Warna pucat berarti tidak ada keterkaitan tambahan; merah pekat berarti dua item saling terkait di luar kemampuan yang diukur (local dependence), biru be
