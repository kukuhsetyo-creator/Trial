<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agen Analisis Kualitatif</title>
<!--
  Agen Analisis Kualitatif, edisi peramban.
  Satu berkas HTML yang berjalan sepenuhnya di peramban: data tersimpan di
  IndexedDB peramban ini, dan satu-satunya yang dikirim keluar adalah teks yang
  diminta peneliti untuk dianalisis, langsung ke api.anthropic.com.

  Pustaka pihak ketiga yang disematkan:
    mammoth.js 1.8.0   (BSD-2-Clause)  pembaca .docx
    pdf.js 3.11.174    (Apache-2.0)    pembaca .pdf
  Teks lisensi lengkap ada di folder web/vendor pada kode sumber.
-->
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #66645d;
  --line: #dedbd2; --accent: #2f5d50; --accent-ink: #ffffff;
  --warn-bg: #fff4d6; --warn-ink: #6b4e00; --err-bg: #fde4e1; --err-ink: #8a1f11;
  --ok-bg: #e2f2e6; --ok-ink: #1f5a2c; --info-bg: #e6eef6; --info-ink: #1f3f5a;
  --chip: #eeece6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161714; --panel: #1f201d; --ink: #ecebe6; --muted: #a7a59c;
    --line: #34352f; --accent: #7fb8a6; --accent-ink: #10201b;
    --warn-bg: #3a3014; --warn-ink: #f2d98c; --err-bg: #3d1d18; --err-ink: #f5b3a8;
    --ok-bg: #1c3322; --ok-ink: #a9dcb4; --info-bg: #1b2a38; --info-ink: #a9c8e6;
    --chip: #2a2b26;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 14px 20px 0; position: sticky; top: 0; z-index: 5; }
header h1 { margin: 0; font-size: 18px; letter-spacing: .2px; }
header .sub { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: none; color: var(--muted); padding: 9px 12px;
  border-bottom: 3px solid transparent; cursor: pointer; font: inherit; font-size: 14px; }
nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 60px; }
h2 { font-size: 20px; margin: 0 0 12px; }
a { color: var(--accent); }
h3 { font-size: 16px; margin: 22px 0 10px; }
p { margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin: 0 0 14px; }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > * { flex: 1 1 200px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
input[type=text], input[type=password], select, textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg); color: var(--ink); font: inherit; }
textarea { min-height: 110px; resize: vertical; }
button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 9px 14px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 14px; }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.btn.danger { color: var(--err-ink); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.note { border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; font-size: 14px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.err { background: var(--err-bg); color: var(--err-ink); }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.note.info { background: var(--info-bg); color: var(--info-ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12.5px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.chip { display: inline-block; background: var(--chip); border-radius: 99px; padding: 1px 9px; font-size: 12px; }
.chip.proposed { background: var(--info-bg); color: var(--info-ink); }
.chip.validated { background: var(--ok-bg); color: var(--ok-ink); }
.chip.revised { background: var(--warn-bg); color: var(--warn-ink); }
.chip.rejected { background: var(--err-bg); color: var(--err-ink); }
blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--ink); }
.progress { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
details { margin: 6px 0; }
summary { cursor: pointer; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 10px; font-size: 12.5px; max-height: 320px; overflow: auto; }
.steps { margin: 0; padding-left: 20px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); max-width: 92vw;
  z-index: 20; display: none; }
@media (max-width: 560px) { header { padding: 10px 12px 0; position: static; } main { padding: 16px 12px 50px; } }
</style>
</head>
<body>
<header>
  <h1>Agen Analisis Kualitatif</h1>
  <div class="sub">Edisi peramban · data tersimpan di peramban ini, tidak di server mana pun</div>
  <nav id="nav"></nav>
</header>
<main id="view"><p class="muted">Memuat…</p></main>
<div id="toast"></div>
<noscript><p style="padding:20px">Aplikasi ini memerlukan JavaScript. Aktifkan JavaScript di peramban Anda.</p></noscript>
<!--VENDOR-->
<script>
/*APP*/
</script>
</body>
</html>
