<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualitative Analysis Form · CSPS</title>
<!--
  Qualitative Analysis Form (CSPS), edisi peramban.
  Satu berkas HTML yang berjalan sepenuhnya di peramban: data tersimpan di
  IndexedDB peramban ini, dan satu-satunya yang dikirim keluar adalah teks yang
  diminta peneliti untuk dianalisis, langsung ke penyedia AI yang ia pilih
  (Anthropic, Google, Alibaba Qwen, DeepSeek, OpenAI, OpenRouter, layanan lain
  yang kompatibel OpenAI, atau Ollama di komputer sendiri).

  Pustaka pihak ketiga yang disematkan:
    mammoth.js 1.8.0   (BSD-2-Clause)  pembaca .docx
    pdf.js 3.11.174    (Apache-2.0)    pembaca .pdf
  Teks lisensi lengkap ada di folder web/vendor pada kode sumber.

  Identitas visual CSPS (Center for Social Psychology and Society): logo dan
  palet diambil dari deck proposal CSPS. Font disematkan, tanpa permintaan
  jaringan: Cormorant Garamond, Montserrat, Allura (SIL Open Font License 1.1,
  teks lisensi di web/assets/fonts).
-->
<style>
/*FONTS*/
:root {
  /* Palet CSPS */
  --navy: #1F2F45; --navy-deep: #172336; --cream: #F7F3EE; --sand: #EFE2D3;
  --bronze: #8F6A4E; --bronze-ink: #7A5638; --ink: #2A2522; --body: #3E3530;
  --bg: #F7F3EE; --panel: #FFFDFA; --line: #E4D9CC; --muted: #6B5D52;
  --accent: #7A5638; --accent-ink: #FFF8F0; --focus: #B8640F;
  --head-bg: #1F2F45; --head-ink: #F7F3EE; --head-muted: #D9CBBB; --tab: #E6DCCF;
  --zebra: #FAF6F1; --chip: #F1E8DE;
  --warn-bg: #FBEBD3; --warn-ink: #7A3F06;
  --err-bg: #FBE3DA; --err-ink: #8A3418;
  --ok-bg: #E3EAF6; --ok-ink: #24406F;
  --info-bg: #ECE6F7; --info-ink: #4A3480;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Montserrat", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --script: "Allura", "Brush Script MT", cursive;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121A26; --panel: #1A2536; --line: #2F3F56; --ink: #F7F3EE; --body: #E6DCCF;
    --muted: #B9AC9F; --accent: #D4B396; --accent-ink: #1A1410; --focus: #F4B35E;
    --head-bg: #0F1724; --head-ink: #F7F3EE; --head-muted: #CBBDAD; --tab: #D9CBBB;
    --zebra: #1D2A3C; --chip: #263449;
    --warn-bg: #3A2A12; --warn-ink: #F6CF95;
    --err-bg: #3D2018; --err-ink: #F5B8A3;
    --ok-bg: #1C2C47; --ok-ink: #AFC6EC;
    --info-bg: #2A2142; --info-ink: #CFC2F0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--body); font-family: var(--sans);
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
/* Kepala halaman */
header { background: var(--head-bg); color: var(--head-ink); }
.brand { max-width: 1080px; margin: 0 auto; padding: 16px 24px 12px; display: flex; align-items: center; gap: 16px; }
.brand img { height: 40px; width: auto; display: block; }
.brand .bar { width: 1px; align-self: stretch; background: var(--head-muted); opacity: .5; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.1; color: var(--head-ink); letter-spacing: .3px; }
.brand .tag { font-family: var(--script); font-size: 20px; line-height: 1.1; color: var(--head-muted); }
.navwrap { background: var(--head-bg); border-top: 1px solid rgba(247,243,238,.12); }
nav { max-width: 1080px; margin: 0 auto; padding: 0 12px; display: flex; gap: 0; flex-wrap: nowrap;
  overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: 0 0 auto; white-space: nowrap; border: 0; background: none; color: var(--tab); padding: 12px 11px; min-height: 44px;
  border-bottom: 3px solid transparent; cursor: pointer; font-family: var(--sans); font-size: 13px;
  font-weight: 600; letter-spacing: .8px; text-transform: uppercase; }
nav button:hover { color: #FFFFFF; }
nav button[aria-current="page"] { color: #FFFFFF; border-bottom-color: #D4B396; }
@media (min-width: 768px) { .navwrap { position: sticky; top: 0; z-index: 5; } }
/* Isi */
main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 48px; }
h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.2; color: var(--ink);
  margin: 0 0 16px; letter-spacing: .3px; }
h2::after { content: ""; display: block; width: 48px; height: 2px; background: var(--accent); margin-top: 8px; }
h3 { font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--accent); margin: 32px 0 12px; }
.card h3 { margin-top: 0; }
p { margin: 0 0 12px; }
a { color: var(--accent); text-underline-offset: 3px; }
code { font-size: 13px; background: var(--chip); padding: 1px 6px; border-radius: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin: 0 0 16px;
  box-shadow: 0 1px 2px rgba(31,47,69,.05); }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
.row > * { flex: 1 1 200px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
input[type=text], input[type=password], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--bg); color: var(--ink); font: inherit; }
input[type=file] { font: inherit; font-size: 13px; color: var(--body); max-width: 100%; }
textarea { min-height: 120px; resize: vertical; }
button.btn { min-height: 40px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 8px 16px; border-radius: var(--r); cursor: pointer; font-family: var(--sans); font-size: 13px;
  font-weight: 600; letter-spacing: .3px; }
button.btn:hover:not(:disabled) { border-color: var(--accent); }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.btn.danger { color: var(--err-ink); background: transparent; border-color: var(--line); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.note { border-radius: var(--r); padding: 12px 16px; margin: 0 0 16px; font-size: 15px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.err { background: var(--err-bg); color: var(--err-ink); }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.note.info { background: var(--info-bg); color: var(--info-ink); }
.note a { color: inherit; font-weight: 600; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; margin: 0 0 16px;
  text-align: center; color: var(--muted); }
.empty::before { content: ""; display: block; width: 32px; height: 2px; background: var(--accent); margin: 0 auto 12px; opacity: .6; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.stat b { display: block; font-family: var(--sans); font-weight: 600; font-size: 26px; line-height: 1.2; color: var(--ink);
  font-variant-numeric: tabular-nums lining-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.tablewrap { overflow-x: auto; padding: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--accent); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
tr:nth-child(even) td { background: var(--zebra); }
.chip { display: inline-block; background: var(--chip); border-radius: 99px; padding: 2px 8px; font-size: 13px; font-weight: 600; }
.chip.proposed { background: var(--info-bg); color: var(--info-ink); }
.chip.validated { background: var(--ok-bg); color: var(--ok-ink); }
.chip.revised { background: var(--warn-bg); color: var(--warn-ink); }
.chip.rejected { background: var(--err-bg); color: var(--err-ink); }
blockquote { margin: 8px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: var(--zebra);
  border-radius: 0 var(--r) var(--r) 0; font-family: var(--serif); font-size: 17px; color: var(--ink);
  font-variant-numeric: lining-nums; }
.progress { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 12px 0; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
details { margin: 0 0 12px; }
details.card { padding: 16px 24px; }
summary { cursor: pointer; min-height: 24px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px; font-size: 13px; max-height: 320px; overflow: auto; }
.steps { margin: 0; padding-left: 24px; }
.steps li { margin: 4px 0; }
footer { max-width: 1080px; margin: 0 auto; padding: 16px 24px 32px; border-top: 1px solid var(--line);
  font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); text-align: right; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: 92vw; z-index: 20; display: none;
  box-shadow: 0 4px 16px rgba(31,47,69,.2); border-radius: var(--r); }
#toast .note { margin: 0; }
@media (max-width: 560px) {
  .brand { padding: 12px 16px 8px; gap: 12px; }
  .brand img { height: 32px; }
  .brand h1 { font-size: 20px; }
  .brand .tag { font-size: 15px; }
  .brand .bar { display: none; }
  nav { padding: 0 4px; }
  nav button { padding: 12px 10px; letter-spacing: .5px; }
  main { padding: 24px 16px 40px; }
  .card { padding: 16px; }
  footer { padding: 16px; text-align: center; letter-spacing: 1px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="{{LOGO_CSPS}}" alt="Logo CSPS" width="129" height="40">
    <div class="bar" aria-hidden="true"></div>
    <div>
      <h1>Qualitative Analysis Form</h1>
      <div class="tag">Center for Social Psychology and Society</div>
    </div>
  </div>
  <div class="navwrap"><nav id="nav"></nav></div>
</header>
<main id="view"><p class="muted">Memuat…</p></main>
<footer>Center for Social Psychology and Society · Data tersimpan di peramban ini</footer>
<div id="toast"></div>
<noscript><p style="padding:20px">Aplikasi ini memerlukan JavaScript. Aktifkan JavaScript di peramban Anda.</p></noscript>
<!--VENDOR-->
<script>
/*APP*/
</script>
</body>
</html>
